<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>列车运行图</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#fff; --fg:#222; --muted:#777; --line:#ddd; --grid:#ececec; --grid2:#f6f6f6; --sel:#e6007e; --now:#e08a00; --panel:#fafafa;
          --cG:#c8372d; --cD:#2b6cb0; --cC:#4a90d9; --cS:#0f9d9a; --cZ:#7b3fa0; --cT:#a05cc0; --cK:#2f8f3a; --cO:#7a7a7a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1b1b; --fg:#e6e6e6; --muted:#9a9a9a; --line:#3a3a3a;
          --grid:#2c2c2c; --grid2:#232323; --sel:#ff4fc0; --now:#ffcc33; --panel:#222;
          --cG:#ff6b5e; --cD:#5aa9e6; --cC:#8cc4f2; --cS:#3fd0c8; --cZ:#c38be0; --cT:#d7a4ee; --cK:#6fcf70; --cO:#a8a8a8; } }
  :root[data-theme="dark"] { --bg:#1b1b1b; --fg:#e6e6e6; --muted:#9a9a9a; --line:#3a3a3a; --grid:#2c2c2c; --grid2:#232323; --sel:#ff4fc0; --now:#ffcc33; --panel:#222;
          --cG:#ff6b5e; --cD:#5aa9e6; --cC:#8cc4f2; --cS:#3fd0c8; --cZ:#c38be0; --cT:#d7a4ee; --cK:#6fcf70; --cO:#a8a8a8; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px system-ui, -apple-system, "PingFang SC", sans-serif; overflow:hidden; }
  #bar { position:fixed; top:0; left:0; right:0; min-height:42px; display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px;
         padding:6px 12px; border-bottom:1px solid var(--line); background:var(--bg); z-index:3; }
  #bar b { font-size:14px; }
  #bar select, #bar input[type=text], #bar button { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:4px; padding:3px 6px; }
  #bar button { cursor:pointer; padding:3px 8px; }
  #bar button:disabled { opacity:.35; cursor:default; }
  .seg { display:inline-flex; }
  .seg button { min-width:28px; height:28px; padding:0 !important; border-radius:0 !important; margin-left:-1px; }
  .seg button:first-child { border-radius:4px 0 0 4px !important; margin-left:0; }
  .seg button:last-child { border-radius:0 4px 4px 0 !important; }
  .seg button.on { background:var(--sel) !important; border-color:var(--sel) !important; color:#fff !important; position:relative; }
  #dir button { min-width:40px; }
  #lineq { width:220px; max-width:52vw; }
  .note { color:var(--muted); font-size:11px; }
  .warn { color:#d9822b; }
  #legend { display:flex; gap:8px; flex-wrap:wrap; }
  #legend i { display:inline-block; width:14px; height:3px; vertical-align:middle; margin-right:3px; border-radius:2px; }
  #main { position:fixed; left:0; right:0; bottom:0; display:flex; }
  #wrap { position:relative; flex:1; min-width:0; }
  canvas { position:absolute; left:0; top:0; touch-action:none; cursor:grab; }
  canvas.drag { cursor:grabbing; }
  #side { width:324px; border-left:1px solid var(--line); background:var(--panel); overflow:hidden; padding:10px 12px;
          display:flex; flex-direction:column; }
  #side > * { flex-shrink:0; }
  #side h3 { margin:0 0 4px; font-size:17px; font-weight:700; display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; line-height:1.25; }
  #side h3 .note, #side h3 .tag { font-weight:normal; }
  #side .od { font-size:14px; font-weight:600; margin-bottom:2px; }
  #side .od .note { font-weight:normal; margin-left:4px; }
  #side .tw { flex:1 1 auto; min-height:80px; overflow:auto; margin-top:6px; border-top:1px solid var(--line); }
  #side .tw table { border-collapse:collapse; width:100%; margin-top:0; font-size:12px; }
  #side .tw th { position:sticky; top:0; z-index:1; background:var(--panel); text-align:left; font-weight:normal; color:var(--muted);
                 font-size:11px; padding:3px 4px; box-shadow:0 1px 0 var(--line); white-space:nowrap; }
  #side .tw th.num, #side .tw td.num { text-align:right; font-variant-numeric:tabular-nums; }
  #side td { padding:3px 4px; border-top:1px solid var(--line); white-space:nowrap; }
  #side td:first-child { width:100%; max-width:0; overflow:hidden; text-overflow:ellipsis; }
  #side tr.wait td { font-style:italic; color:var(--muted); font-size:11.5px; }
  #side tr.wait td:first-child { padding-left:8px; }
  #side tr.off td { color:var(--muted); }
  #side a { color:var(--sel); cursor:pointer; text-decoration:none; }
  #side a[data-pan] { color:inherit; text-decoration:underline dotted; }
  #side a[data-pan]:hover { color:var(--sel); }
  #side .tm { cursor:pointer; }
  #side .tm:hover { text-decoration:underline; color:var(--sel); }
  #side .foot { margin-top:6px; padding-top:4px; border-top:1px solid var(--line); color:var(--muted); font-size:11px;
                display:flex; justify-content:space-between; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .more { text-decoration:underline dotted; cursor:help; flex:none; }
  sup.day { font-size:9px; line-height:0; vertical-align:super; margin-left:.5px; font-weight:normal; }
  svg.ext { width:11px; height:11px; vertical-align:-1px; margin-left:1px; opacity:.75; }
  .emu-row { display:flex; align-items:center; gap:5px; margin:1px 0 3px; line-height:1.2; }
  .emu-ico { display:inline-flex; align-items:center; line-height:0; text-decoration:none !important; flex:none; }
  .emu-ico svg { display:block; }
  #tip { position:fixed; pointer-events:none; background:var(--bg); border:1px solid var(--line); padding:3px 7px; border-radius:4px;
         display:none; box-shadow:0 1px 4px rgba(0,0,0,.18); white-space:nowrap; z-index:5; font-size:11px; line-height:1.3; }
  #tip b { font-size:11.5px; font-weight:600; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); pointer-events:none; }
  @media (max-width: 760px) {
    #main { flex-direction:column; }
    #side { width:auto; height:34%; border-left:none; border-top:1px solid var(--line); }
    #legend, .hint { display:none; }
  }
</style>
</head>
<body>
<div id="bar">
  <b>运行图</b>
  <button id="dprev" title="前一个可选日期">‹</button>
  <select id="date" title="日期"></select>
  <button id="dnext" title="后一个可选日期">›</button>
  <input id="lineq" type="text" list="lines" placeholder="线路（客里表），如 京沪高速线" autocomplete="off">
  <datalist id="lines"></datalist>
  <select id="zx" title="支线" style="display:none"></select>
  <span id="dir" class="seg" title="按本线里程方向显示，两个都亮就是上下行都看"><button data-v="down" class="on" title="下行（里程增加）">下行</button><button data-v="up" class="on" title="上行（里程减少）">上行</button></span>
  <label class="note"><input type="checkbox" id="showPost"> 线路所</label>
  <label class="note"><input type="checkbox" id="showWait" checked> 推定停车</label>
  <span id="legend"></span>
  <span class="note hint">滚轮缩放时间 · Shift+滚轮缩放里程 · 拖动平移 · 双击复位 · 点击车次</span>
</div>
<div id="main">
  <div id="wrap"><canvas id="c"></canvas><div id="loading">加载中…</div></div>
  <div id="side"></div>
</div>
<div id="tip"></div>
<script src="emu_icons.js?v=4"></script>
<script>
'use strict';
// 列车运行图（时间–里程图）。数据全在浏览器端算：
//   map_dates.json / map_data_<日期>.json（与地图同一份：几何 geoms、区间 [几何, 发, 到, km, 运行曲线, 推定停车?]、运行曲线 profiles、
//   几何的线路分段 glines）+ map_kelibiao.json（客里表线路：站序与线上里程）。
// 线路参照：客里表该线（某支线）各站，用地图数据里的车站坐标连成折线，站间按官方里程线性插值。
// 列车位置：与地图 state() 同一套推算——区间内 t 时刻的几何里程按运行曲线（时间比例→距离比例）插值；
//   几何上各折点预先投影到该线（只取 glines 里线路名属于该线 OSM 线名的段；离线超过容差的点视为不在线上）。
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cv = $('c'), ctx = cv.getContext('2d'), tip = $('tip');
const CLASSES = [['G', '高速 G'], ['D', '动车 D'], ['C', '城际 C'], ['S', '市域 S'], ['Z', '直达 Z'], ['T', '特快 T'], ['K', '快速 K'], ['O', '其他']];
const clsOf = c => { const h = c[0]; return 'GDCSZTK'.includes(h) ? h : 'O'; };
const fmt = m => { m = Math.round(m); const d = Math.floor(m / 1440); m -= d * 1440;
  return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}${d > 0 ? '⁺' + d : d < 0 ? '⁻' + (-d) : ''}`; };
const fmtH = m => { m = Math.round(m); const d = Math.floor(m / 1440); m -= d * 1440;
  return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}${d ? `<sup class="day">${d > 0 ? '+' + d : d}</sup>` : ''}`; };
const EXT_SVG = '<svg class="ext" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5L8.5 3.5M8.5 3.5H4.5M8.5 3.5V7.5"/></svg>';
const emuTag = (tr, link = false) => {
  if (!tr.m && !tr.dw) return '';
  const tipTxt = `${tr.m ? '12306 当天车型 ' + (tr.ts || tr.m) : ''}${tr.dw ? (tr.m ? '；' : '') + '动卧：车型配置有卧铺车厢' : ''}`;
  const txt = `<span class="note" title="${tipTxt}">${[tr.m, tr.fx && '复兴号', tr.dj && '动集', tr.dw && '动卧'].filter(Boolean).join(' · ')}</span>`;
  const svg = tr.m && typeof emuHalfSvg === 'function' ? emuHalfSvg(tr.m, 16) : '';
  if (!svg) return txt;
  const ico = link
    ? `<a class="emu-ico" href="emu.html#half&${encodeURIComponent(resolveEmuModel(tr.m) || tr.m)}" target="_blank" title="${tipTxt} · 点击查看侧面涂装图鉴">${svg}</a>`
    : `<span class="emu-ico">${svg}</span>`;
  return txt + ico;
};
const tm = (v, f) => `<span class="tm" data-t="${v}" title="跳到这个时刻">${f(v)}</span>`;
const kmTxt = k => k == null ? '' : (Math.round(k * 10) / 10).toString();

let DATES = null, curDate = null, D = null, G = null, KB = null, STN = {};
let lineId = null, zx = 0, LINE = null, TR = [], sel = null, hover = null;
let view = { t0: 0, t1: 1440, k0: 0, k1: 100 }, kmin = 0, kmax = 100;
const PAD = { l: 112, r: 14, t: 14, b: 26 };
let W = 0, H = 0;

// ===== 网址锚点 =====
function findLineId(v, allowNumericId = true) {
  if (!KB || !v) return null;
  try { v = decodeURIComponent(String(v)).trim(); } catch (e) { v = String(v).trim(); }
  if (allowNumericId && KB.lines[v]) return v;
  for (const [id, ln] of Object.entries(KB.lines)) {
    if (ln.n === v) return id;
  }
  const vNorm = v.replace(/线$/, '');
  for (const [id, ln] of Object.entries(KB.lines)) {
    if (ln.n.replace(/线$/, '') === vNorm || ln.n === v + '线' || ln.n + '线' === v) return id;
  }
  const ALIAS = {
    '京沪高铁': '京沪高速线',
    '京广高铁': '京广高铁',
    '京包客专': '京包客专线',
    '石太客专': '石太客专线',
    '兰新客专': '兰新客专线',
    '成渝高铁': '成渝客专',
  };
  if (ALIAS[v]) {
    for (const [id, ln] of Object.entries(KB.lines)) {
      if (ln.n === ALIAS[v]) return id;
    }
  }
  if (vNorm.length >= 2) {
    for (const [id, ln] of Object.entries(KB.lines)) {
      if (ln.n.includes(vNorm)) return id;
    }
  }
  return null;
}

function readHash() {
  const h = {};
  let raw = '';
  try { raw = decodeURIComponent(location.hash.slice(1)); } catch (e) { raw = location.hash.slice(1); }
  if (!raw) return h;
  const pairs = raw.split('&');
  for (const kv of pairs) {
    if (!kv) continue;
    const i = kv.indexOf('=');
    if (i < 0) {
      const token = kv.trim();
      const lid = findLineId(token, false);
      if (lid) h.line = lid;
      else if (!h.train) h.train = token;
      continue;
    }
    const k = kv.slice(0, i).trim(), v = kv.slice(i + 1).trim();
    if (k === 'train' || k === 'tr' || k === 'c') h.train = v;
    else if (k === 'line' || k === 'ln') h.line = findLineId(v, true) || v;
    else if (k === 'date' || k === 'd') h.date = v;
    else if (k === 'time' || k === 't') {
      if (v.includes(':')) {
        const [hh, mm] = v.split(':').map(Number);
        if (!isNaN(hh) && !isNaN(mm)) h.time = Math.max(0, Math.min(1440, hh * 60 + mm));
      } else {
        const num = Number(v);
        if (!isNaN(num) && num >= 0 && num <= 1440) h.time = num;
      }
    } else h[k] = v;
  }
  return h;
}
function writeHash() {
  const parts = [];
  if (lineId && KB && KB.lines[lineId]) parts.push(KB.lines[lineId].n);
  if (sel) {
    parts.push(sel.tr.c.split('/')[0]);
    if (sel.tr.od) parts.push('od=' + sel.tr.od);
  }
  if (zx) parts.push('zx=' + zx);
  if ($('dir').value) parts.push('dir=' + $('dir').value);
  const isDefaultDate = !curDate || (DATES && curDate === DATES.default);
  if (curDate && !isDefaultDate) parts.push('date=' + curDate);
  const h = parts.join('&');
  if (h !== location.hash.slice(1)) history.replaceState(null, '', '#' + h);
}
const findTrain = (code, od) => !code ? null : (od
  ? TR.find(o => o.tr.c.split('/').includes(code) && o.tr.od === od)
  : TR.find(o => o.tr.c.split('/').includes(code) && !o.tr.od))
  || TR.find(o => o.tr.c.split('/').includes(code)) || null;

// ===== 日期 =====
const dateEntry = d => DATES && DATES.dates.find(x => x.date === d);
const selectable = () => (DATES ? DATES.dates.filter(x => x.selectable && x.file) : []);
function renderDates() {
  const s = $('date');
  s.innerHTML = (DATES ? DATES.dates : []).map(e => {
    const wd = '日一二三四五六'[new Date(e.date + 'T00:00:00Z').getUTCDay()];
    return `<option value="${e.date}"${e.selectable ? '' : ' disabled'}>${e.date.slice(5)} 周${wd}${e.selectable ? '' : `（${e.reason || '不可选'}）`}</option>`;
  }).join('');
  s.value = curDate || '';
  const ss = selectable(), i = ss.findIndex(x => x.date === curDate);
  $('dprev').disabled = i <= 0; $('dnext').disabled = i < 0 || i >= ss.length - 1;
}
// 发布用的打包格式（viz/pack.py）：几何与线路分段放在各日共用的文件，每日文件只引用全局下标。
//   data.geo     粗糙几何（map_geo_lo.json，lod "lo"）+ 线路分段：首屏用，点少、逐点里程按折线长度比例内插
//   data.geo_hi  精细几何（map_geo.json，lod "hi"）：首屏之后再下载，到了原地替换 G 的各项
// 旧打包（v1）的 map_geo.json 自带全部字段；未打包的文件（本地 data/derived/viz）没有 data.geo，原样使用。
// 每个文件只下载、解码一次。
const GEO_CACHE = new Map();   // url → promise → { G, geo }
function decodeGeo(geo) {
  const f = geo.pts, n = f.length / 2, X = new Float64Array(n), Y = new Float64Array(n);
  for (let i = 0, x = 0, y = 0; i < n; i++) { x += f[2 * i]; y += f[2 * i + 1]; X[i] = x / 1e5; Y[i] = y / 1e5; }
  const G = geo.geoms.map((r, gi) => {
    let m = 0;
    for (let a = 1; a < r.length; a += 2) m += Math.abs(r[a]);
    const km = new Float64Array(m), lon = new Float64Array(m), lat = new Float64Array(m);
    for (let a = 0, j = 0, prev = 0; a < r.length; a += 2) {
      const s = prev + r[a], L = r[a + 1], d = L < 0 ? -1 : 1;
      for (let t = 0; t < Math.abs(L); t++, j++) { const p = s + d * t; lon[j] = X[p]; lat[j] = Y[p]; }
      prev = s + d * (Math.abs(L) - 1);
    }
    if (geo.gkm) { const dk = geo.gkm[gi]; for (let j = 0, k = 0; j < m; j++) { k += dk[j]; km[j] = k / 1e4; } }
    else {                                       // 粗糙几何：首末里程准确，中间按折线长度比例
      const [k0, len] = geo.gk[gi], c = Math.cos(lat[0] * Math.PI / 180);
      for (let j = 1; j < m; j++) km[j] = km[j - 1] + Math.hypot((lon[j] - lon[j - 1]) * c, lat[j] - lat[j - 1]);
      const tot = m > 1 ? km[m - 1] : 0;
      for (let j = 0; j < m; j++) km[j] = (k0 + len * (tot > 0 ? km[j] / tot : m > 1 ? j / (m - 1) : 0)) / 1e4;
    }
    return { km, lon, lat };
  });
  geo.pts = geo.geoms = geo.gkm = geo.gk = null;      // 解码后不再需要，释放
  return { G, geo };
}
// 每日文件切成两片（viz/pack.py split_day）：首片 + 其余，按首片各车的原序号合并，其余片的运行曲线下标顺延
function mergeRest(main, rest) {
  const off = main.profiles.length, a = main.split.a, n = main.trains.length + rest.trains.length;
  for (const t of rest.trains) for (const lg of t.l) if (lg) lg[4] += off;
  const trains = new Array(n), isA = new Uint8Array(n);
  a.forEach((i, k) => { trains[i] = main.trains[k]; isA[i] = 1; });
  for (let i = 0, j = 0; i < n; i++) if (!isA[i]) trains[i] = rest.trains[j++];
  return { ...main, trains, profiles: main.profiles.concat(rest.profiles), split: null };
}
const fetchJson = url => fetch(url).then(r => { if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); });
function preloadGeo(url) {
  if (!url) return null;
  if (!GEO_CACHE.has(url)) {
    const promise = fetch(url).then(r => { if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }).then(decodeGeo);
    promise.catch(() => GEO_CACHE.delete(url));   // 失败了下次重拉；也抑制预拉取期间的未捕获告警
    GEO_CACHE.set(url, promise);
  }
  return GEO_CACHE.get(url);
}
// 运行图要精细几何（按坐标把几何点投到线路上），粗糙版只取线路分段等字段
async function expandGeo(data) {
  if (!data.geo) return data;
  const [lo, hi] = await Promise.all([preloadGeo(data.geo), data.geo_hi ? preloadGeo(data.geo_hi) : null]);
  const geo = lo.geo;
  Object.assign(data, { _G: (hi || lo).G, glines: geo.glines, gmember: geo.gmember, line_names: geo.line_names,
                        member_sets: geo.member_sets, profiles: data.profiles || geo.profiles,
                        profile_scale: data.profile_scale ?? geo.profile_scale });
  return data;
}
async function loadDate(date) {
  const e = dateEntry(date);
  const file = e ? e.file : 'map_data.json';
  $('loading').style.display = ''; $('loading').textContent = `加载 ${date || ''} 数据…`;
  const r = await fetch(file);
  if (!r.ok) { $('loading').textContent = `${date} 加载失败（${r.status}）`; return false; }
  try {
    let data = await r.json();
    const restP = data.split ? fetchJson(data.split.rest) : null;   // 运行图要整天数据：其余片与几何并行下载
    if (restP) restP.catch(() => {});
    data = await expandGeo(data);
    D = restP ? mergeRest(data, await restP) : data;
  }
  catch (err) { $('loading').textContent = `${date} 加载失败（${err.message}）`; return false; }
  curDate = D.date || date;
  G = D._G || D.geoms.map(g => ({
    km: Float64Array.from(g, p => p[0]),
    lon: Float64Array.from(g, p => p[1]),
    lat: Float64Array.from(g, p => p[2]),
    ele: g[0] && g[0].length > 3 ? Int16Array.from(g, p => p[3]) : null,
  }));
  STN = {};
  for (const [name, lon, lat, n, code, ele] of D.stations || []) STN[name] = { ll: [lon, lat], ele: ele ?? null };
  $('loading').style.display = 'none';
  renderDates();
  return true;
}

// ===== 线路 =====
function renderLineList() {

// 按 1 km 分格统计：某格被空档覆盖的车次 ≥ 2 且 ≥ 经过该格车次的 30%，算差别段；相邻格合并为剪口（≥ CUT_MIN_KM）。

      <div class="od">${S[0][0]} → ${S[S.length - 1][0]}<span class="note">${[span, tr.od ? `${tr.od.slice(5)} 始发${tr.inf ? '（推定）' : ''}` : ''].filter(Boolean).join(' · ')}</span></div>
      ${emu ? `<div class="emu-row">${emu}</div>` : ''}
    </div>
    <div class="tw"><table><thead><tr><th>车站</th><th class="num">到</th><th class="num">发</th><th class="num">停</th></tr></thead><tbody>${S.map((x, i) => {
      const beg = i === 0, end = i === S.length - 1;
      const dw = !beg && !end && x[1] != null && x[2] != null ? Math.round(x[2] - x[1]) : 0;
      const dwTxt = beg ? '<span class="note">始发</span>' : end ? '<span class="note">终到</span>' : dw > 0 ? dw + "'" : '';
      const row = `<tr class="${onLine.has(x[0]) ? '' : 'off'}"><td><a data-pan="${x[0]}" title="地图移到${x[0]}">${x[0]}</a></td><td class="num">${!beg && x[1] != null ? tm(x[1], f) : ''}</td><td class="num">${!end && x[2] != null ? tm(x[2], f) : ''}</td><td class="num">${dwTxt}</td></tr>`;
      const ws = ((tr.l[i] && tr.l[i][5]) || []).filter(w => w[2] > w[1] + 0.05);
      return row + ws.map(w => {
        const wdw = Math.max(1, Math.round(w[2] - w[1]));
        const why = (w[5] || '推断：图定时分比正常运行多出的时间按途中停车处理').replace(/"/g, '&quot;');
        return `<tr class="wait" title="${why}"><td>↳ ${w[3]} <span class="note">${w[4]}</span></td><td class="num">${tm(w[1], f)}</td><td class="num">${tm(w[2], f)}</td><td class="num">${wdw}'</td></tr>`;
      }).join('');
    }).join('')}</tbody></table></div>
    <div class="foot"><span>灰色非本线 · ↳ 斜体推定待避</span><span class="more" title="灰色行为不在本线的停站；斜体行为推定途中待避（鼠标悬停该行可看推定依据）。路径与线上位置均为推断结果。">详情...</span></div>`;
  } else {
    html += `<div class="note" style="margin-top:10px;line-height:1.5">点击图上的运行线查看该车次时刻表。虚线水平段为推定待避停车；线头小圈为列车在站间出入本线（右侧标注去向）。</div>
      <div class="foot" style="margin-top:auto"><span>含前两日始发在途车 · 位置为推断结果</span><span class="more" title="站间位置按运动学推算（起停加减速、线路限速，按时刻表校准）；路径与线上位置均为推断结果。">详情...</span></div>`;
  }
  side.innerHTML = html;
  const tw = side.querySelector('.tw'), firstOn = tw && tw.querySelector('tbody tr:not(.off):not(.wait)');
  if (tw && firstOn) {
    const hh = tw.querySelector('thead').offsetHeight, wr = tw.getBoundingClientRect(), rr = firstOn.getBoundingClientRect();
    tw.scrollTop = Math.max(0, rr.top - wr.top - hh - 24);
  }
  const u = $('unsel'); if (u) u.onclick = () => { sel = null; wantSel = null; writeHash(); sidePanel(); draw(); };
  const m = $('onmap'); if (m) m.onclick = () => showTrainOnMap(sel.tr);
  side.querySelectorAll('a[data-pan]').forEach(el => el.onclick = () => panMap(el.dataset.pan));
  side.querySelectorAll('[data-t]').forEach(el => el.onclick = () => {
    const t = +el.dataset.t;
    mapT = { t: ((t % 1440) + 1440) % 1440, date: curDate };
    if (window.parent !== window) window.parent.postMessage({ type: 'railmap-jump-t', t }, location.origin);
    if (t < view.t0 || t > view.t1) { const s = (view.t1 - view.t0) / 2; view.t0 = t - s; view.t1 = t + s; }
    draw();
  });
}

// ===== 交互 =====
function resize() {
  const wrap = $('wrap'), bar = $('bar').getBoundingClientRect();
  $('main').style.top = bar.height + 'px';
  W = wrap.clientWidth; H = wrap.clientHeight;
  const dpr = devicePixelRatio || 1;
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  draw();
}
function resetView() {
  const pad = (kmax - kmin) * 0.02;
  view = { t0: view.t0 < -200 || view.t1 > 1700 ? 0 : 0, t1: 1440, k0: mapK(kmin) - pad, k1: mapK(kmax) + pad };
}
// 列车选中状态下弹出或切换时自动放大，使选中车次在线上的时间和里程跨度至少占画布长宽的 60%（横轴最多放大到 2 小时视野）
const FIT_RATIO = 0.6, FIT_MIN_T = 120;
function fitSel() {
  if (!sel) return;
  const [tmin, tmax, kmn, kmx] = sel.bb;
  const dt = tmax - tmin, dk = mapK(kmx) - mapK(kmn);
  const wt = Math.min(3600, Math.max(FIT_MIN_T, dt / FIT_RATIO));
  if (view.t1 - view.t0 > wt || tmin < view.t0 || tmax > view.t1) {
    const tc = (tmin + tmax) / 2;
    view.t0 = tc - wt / 2; view.t1 = tc + wt / 2;
  }
  const pad = (kmax - kmin) * 0.02, fk0 = mapK(kmin) - pad, fk1 = mapK(kmax) + pad;
  if (view.k1 - view.k0 > dk / FIT_RATIO || mapK(kmn) < view.k0 || mapK(kmx) > view.k1) {
    const wk = Math.min(fk1 - fk0, Math.max(2, dk / FIT_RATIO)), kc = (mapK(kmn) + mapK(kmx)) / 2;
    let k0 = kc - wk / 2, k1 = kc + wk / 2;
    if (k0 < fk0) { k0 = fk0; k1 = k0 + wk; }
    if (k1 > fk1) { k1 = fk1; k0 = k1 - wk; }
    view.k0 = k0; view.k1 = k1;
  }
}
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const z = Math.exp(e.deltaY * 0.0015);
  if (e.shiftKey || e.ctrlKey) {
    const km = kAt(e.offsetY);
    view.k0 = km - (km - view.k0) * z; view.k1 = km + (view.k1 - km) * z;
    if (view.k1 - view.k0 < 2) { const c = (view.k0 + view.k1) / 2; view.k0 = c - 1; view.k1 = c + 1; }
  } else {
    const tm = tAt(e.offsetX);
    view.t0 = tm - (tm - view.t0) * z; view.t1 = tm + (view.t1 - tm) * z;
    if (view.t1 - view.t0 < 10) { const c = (view.t0 + view.t1) / 2; view.t0 = c - 5; view.t1 = c + 5; }
    if (view.t1 - view.t0 > 3600) { const c = (view.t0 + view.t1) / 2; view.t0 = c - 1800; view.t1 = c + 1800; }
  }
  draw();
}, { passive: false });
// 车站名可点：在地图上显示该站。嵌在地图分屏里时发消息给地图页；单独打开时在新标签页打开地图并定位到该站
let STLAB = [];
const stLabAt = (x, y) => STLAB.find(b => x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1) || null;
function showStation(s) {
  if (window.parent !== window) { window.parent.postMessage({ type: 'railmap-station', name: s.name, ll: s.ll }, location.origin); return; }
  window.open(`map.html#${curDate ? 'date=' + curDate + '&' : ''}station=${encodeURIComponent(s.name)}`, 'railmap-map');
}
// 侧栏时刻表点站名：地图移到该站（不改地图上的选中）。单独打开时在新标签页打开地图并定位到该站
function panMap(name) {
  const s = LINE && LINE.st.find(x => x.name === name), ll = s && s.ll || null;
  if (window.parent !== window) { window.parent.postMessage({ type: 'railmap-pan', name, ll }, location.origin); return; }
  window.open(`map.html#${curDate ? 'date=' + curDate + '&' : ''}station=${encodeURIComponent(name)}`, 'railmap-map');
}
// 侧栏“地图”：在地图上高亮选中的车次。嵌在地图分屏里时发消息给地图页；单独打开时在新标签页打开地图并选中该车
function showTrainOnMap(tr) {
  const code = tr.c.split('/')[0];
  if (window.parent !== window) { window.parent.postMessage({ type: 'railmap-train', code, od: tr.od || null, line: lineId }, location.origin); return; }
  window.open(`map.html#${curDate ? 'date=' + curDate + '&' : ''}train=${encodeURIComponent(code)}${tr.od ? '&od=' + tr.od : ''}`, 'railmap-map');
}
// 地图页同步过来的当前时刻 {t: 当日分钟, date}；连续消息合并到下一帧重画。单独打开时从网址参数、本机记忆或北京时间初始化
let mapT = null, mapTRaf = 0;
function initStandaloneTime(h) {
  if (h && h.time != null) { mapT = { t: h.time, date: curDate }; return; }
  try {
    const sv = JSON.parse(localStorage.getItem('railmap.view'));
    if (sv && typeof sv.t === 'number' && isFinite(sv.t) && sv.t >= 0 && sv.t <= 1440) {
      mapT = { t: sv.t, date: sv.date || curDate };
      return;
    }
  } catch (e) {}
  const now = new Date(Date.now() + 8 * 3600e3);
  mapT = { t: now.getUTCHours() * 60 + now.getUTCMinutes(), date: curDate };
}
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === 'railmap-fit-sel') {
    if (sel) { resetView(); fitSel(); draw(); }
    return;
  }
  if (e.data.type !== 'railmap-time') return;
  mapT = { t: e.data.t, date: e.data.date };
  if (!mapTRaf) mapTRaf = requestAnimationFrame(() => { mapTRaf = 0; draw(); });
});
if (window.parent !== window) {
  window.parent.postMessage({ type: 'railmap-time-req' }, location.origin);
} else {
  addEventListener('storage', e => {
    if (e.key !== 'railmap.view' || !e.newValue) return;
    try {
      const sv = JSON.parse(e.newValue);
      if (sv && typeof sv.t === 'number' && isFinite(sv.t)) {
        mapT = { t: sv.t, date: sv.date || curDate };
        if (!mapTRaf) mapTRaf = requestAnimationFrame(() => { mapTRaf = 0; draw(); });
      }
    } catch (err) {}
  });
}
let drag = null, moved = false;
cv.addEventListener('pointerdown', e => { drag = { x: e.offsetX, y: e.offsetY, v: { ...view } }; moved = false; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointerup', e => {
  cv.classList.remove('drag');
  if (drag && !moved && stLabAt(e.offsetX, e.offsetY)) { showStation(stLabAt(e.offsetX, e.offsetY).s); drag = null; return; }
  if (drag && !moved) {
    const n = nearest(e.offsetX, e.offsetY);
    sel = n ? n.o : null; wantSel = sel ? [sel.tr.c.split('/')[0], sel.tr.od] : null; writeHash(); sidePanel(); draw();
  }
  drag = null;
});
cv.addEventListener('pointermove', e => {
  if (drag) {
    const dx = e.offsetX - drag.x, dy = e.offsetY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) { moved = true; cv.classList.add('drag'); }
    if (moved) {
      const dt = dx / (W - PAD.l - PAD.r) * (drag.v.t1 - drag.v.t0), dk = dy / (H - PAD.t - PAD.b) * (drag.v.k1 - drag.v.k0);
      view = { t0: drag.v.t0 - dt, t1: drag.v.t1 - dt, k0: drag.v.k0 - dk, k1: drag.v.k1 - dk };
      tip.style.display = 'none'; draw();
    }
    return;
  }
  if (!LINE) return;
  const lab = stLabAt(e.offsetX, e.offsetY);
  cv.style.cursor = lab ? 'pointer' : '';
  if (lab) {
    if (hover) { hover = null; draw(); }
    tip.innerHTML = `<b>${lab.s.name}</b> <span class="note">K${kmTxt(lab.s.km)} · 点击在地图上显示</span>`; tip.style.display = 'block';
    tip.style.left = (e.clientX + 14) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
    return;
  }
  const n = nearest(e.offsetX, e.offsetY);
  const h = n ? n.o : null;
  if (h !== hover) { hover = h; draw(); }
  if (n) {
    const tr = n.o.tr, w = n.o.waits.find(w => w[0] <= n.t && n.t <= w[1] && Math.abs(w[2] - n.k) < 0.5);
    tip.innerHTML = `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c${n.o.cls});margin-right:4px"></span><b>${tr.c}</b><div class="note">${tr.s[0][0]} → ${tr.s[tr.s.length - 1][0]}</div>`
      + (w ? `<div class="note"><i>${w[3]} ${w[4]}（推定）</i>${w[5] ? `：${w[5]}` : ''}</div>` : '');
    tip.style.display = 'block';
    const tx = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 6);
    tip.style.left = tx + 'px'; tip.style.top = (e.clientY + 14) + 'px';
  } else tip.style.display = 'none';
});
cv.addEventListener('pointerleave', () => { tip.style.display = 'none'; if (hover) { hover = null; draw(); } });
cv.addEventListener('dblclick', () => { resetView(); draw(); });
addEventListener('resize', resize);
$('showPost').onchange = draw;
$('dir').onchange = () => { if (sel && !dirOk(sel)) sel = null; writeHash(); sidePanel(); draw(); };
$('showWait').onchange = () => { sampleTrains(); sel = wantSel ? findTrain(wantSel[0], wantSel[1]) : null; draw(); };
$('zx').onchange = e => { e.target.blur(); zx = +e.target.value; selectLine(lineId, true); };
$('lineq').onchange = e => {
  const v = e.target.value.trim(), id = LINE_BY_LABEL[v] || (KB.lines[v] ? v : null)
    || Object.keys(KB.lines).find(i => KB.lines[i].n === v);
  if (id) { e.target.blur(); zx = 0; selectLine(id, true); } else e.target.value = LINE ? lineLabel(lineId) : '';
};
const defaultDate = () => {
  if (!DATES) return null;
  const ss = selectable();
  if (!ss.length) return null;
  const today = new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
  return (ss.find(x => x.date === DATES.default) || ss.find(x => x.date === today) || ss[ss.length - 1]).date;
};
$('date').onchange = e => {
  e.target.blur();
  if (window.parent !== window) window.parent.postMessage({ type: 'railmap-date', date: e.target.value }, location.origin);
  switchDate(e.target.value);
};
const stepDate = k => { const ss = selectable(), i = ss.findIndex(x => x.date === curDate), j = i + k;
  if (i >= 0 && j >= 0 && j < ss.length) {
    if (window.parent !== window) window.parent.postMessage({ type: 'railmap-date', date: ss[j].date }, location.origin);
    switchDate(ss[j].date);
  }
};
$('dprev').onclick = () => stepDate(-1);
$('dnext').onclick = () => stepDate(1);
document.addEventListener('click', e => {
  const el = e.target.closest('button, a, input[type=checkbox]');
  if (el) el.blur();
});
// 嵌在地图分屏里时，把空格与左右方向键转给地图页控制播放/快进快退
document.addEventListener('keydown', e => {
  if (window.parent === window || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest('input:not([type=checkbox]), select, textarea, [contenteditable]')) return;
  if (e.code === 'Space' || e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
    e.preventDefault(); e.stopPropagation();
    window.parent.postMessage({ type: 'railmap-key', code: e.code, repeat: e.repeat }, location.origin);
  }
}, true);
let wantSel = null;
addEventListener('hashchange', () => {
  if (!D || !KB) return;
  const h = readHash();
  if (h.time != null) mapT = { t: h.time, date: h.date || curDate };
  const dv = h.dir === 'up' || h.dir === 'down' ? h.dir : '';
  if (dv !== $('dir').value) $('dir').value = dv;
  const targetDate = (h.date && dateEntry(h.date) && dateEntry(h.date).selectable ? h.date : null) || defaultDate();
  if (targetDate && targetDate !== curDate) { switchDate(targetDate, h); return; }
  const lid = findLineId(h.line);
  if (lid && (lid !== lineId || +(h.zx || 0) !== zx) && KB && KB.lines[lid]) {
    zx = +(h.zx || 0);
    selectLine(lid, true, [h.train, h.od]);
    return;
  }
  const prevSel = sel;
  wantSel = h.train ? [h.train, h.od] : null;
  sel = findTrain(h.train, h.od);
  if (sel && !dirOk(sel)) $('dir').value = '';
  if (sel && sel !== prevSel) { resetView(); fitSel(); }
  writeHash(); sidePanel(); draw();
});

function selectLine(id, reset, wantTrain) {
  if (wantTrain !== undefined) wantSel = wantTrain && wantTrain[0] ? wantTrain : null;
  const [selCode, selOd] = wantSel || [sel ? sel.tr.c.split('/')[0] : null, sel ? sel.tr.od : null];
  lineId = id;
  $('lineq').value = id ? lineLabel(id) : '';
  buildLine();
  sampleTrains();
  sel = findTrain(selCode, selOd);
  if (sel && !dirOk(sel)) $('dir').value = '';
  if (reset) { resetView(); fitSel(); }
  writeHash(); sidePanel(); draw();
}
async function switchDate(date, h) {
  const e = dateEntry(date);
  if (DATES && (!e || !e.selectable)) { renderDates(); return; }
  const ok = await loadDate(date);
  if (!ok) return;
  const curH = h || readHash();
  const targetLine = findLineId(curH && curH.line);
  const newLine = Boolean(targetLine && KB.lines[targetLine] && (targetLine !== lineId || !LINE));
  if (targetLine && KB.lines[targetLine]) { zx = +(curH.zx || 0); lineId = targetLine; }
  selectLine(lineId, newLine, curH && curH.train ? [curH.train, curH.od] : undefined);
}

(async function init() {
  $('legend').innerHTML = CLASSES.map(([k, n]) => `<span class="note"><i style="background:var(--c${k})"></i>${n}</span>`).join('');
  resize();
  try { const r = await fetch('map_dates.json', { cache: 'no-cache' }); if (r.ok) DATES = await r.json(); } catch (e) {}
  if (DATES && !selectable().length) DATES = null;
  if (!DATES) { $('date').style.display = $('dprev').style.display = $('dnext').style.display = 'none'; }
  if (DATES && DATES.geo) preloadGeo(DATES.geo);
  const kbrPromise = fetch((DATES && DATES.kelibiao) || 'map_kelibiao.json').then(r => r.json());
  let h = readHash();
  if (h.dir === 'up' || h.dir === 'down') $('dir').value = h.dir;
  let date = (h.date && dateEntry(h.date) && dateEntry(h.date).selectable ? h.date : null) || defaultDate();
  const [, ok] = await Promise.all([
    kbrPromise.then(kb => { KB = kb; renderLineList(); }),
    loadDate(date),
  ]);
  if (!ok) return;
  h = readHash();
  const latestDate = (h.date && dateEntry(h.date) && dateEntry(h.date).selectable ? h.date : null) || defaultDate();
  if (latestDate && latestDate !== curDate && !(await loadDate(latestDate))) return;
  if (window.parent !== window) window.parent.postMessage({ type: 'railmap-time-req' }, location.origin);
  else initStandaloneTime(h);
  zx = +(h.zx || 0);
  const lid = findLineId(h.line);
  if (lid) {
    selectLine(lid, true, [h.train, h.od]);
  } else { sidePanel(); draw(); $('lineq').focus(); }
  resize();
})();
</script>
</body>
