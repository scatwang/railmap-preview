<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>列车位置地图</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet.min.css">
<script src="vendor/leaflet.min.js"></script>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/leaflet-maplibre-gl.js"></script>
<style>
  :root { color-scheme:light dark; }   /* 原生下拉框、输入框跟随深浅色 */
  :root { --bg:#fff; --fg:#222; --muted:#777; --line:#ddd; --sel:#e6007e; --hl:#0891b2;
          --r0:#b0272f; --r1:#e8892b; --r2:#3a78b5; --r3:#9aa0a6;
          --tS:#a7aeb6; --tW:#ffffff; --tJ:#2e9a63; --tZT:#8a9a52; --tK:#3f9142; --tO:#1d5a3a;
          --tGold:#d4a017; --tEdge:#4a4a4a;
          --bLand:#f3f2ee; --bWater:#c6d9e6; --bRiver:#a9c6dc; --bUrban:#e4e1da;
          --bShade:#5f5a50; --bLit:#ffffff; --bShadeK:0.35;
          --stFill:#d4d4d4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1b1b; --fg:#e6e6e6; --muted:#9a9a9a; --line:#3a3a3a; --sel:#ff4fc0; --hl:#22d3ee;
          --r0:#e5484d; --r1:#f0a04b; --r2:#5b9bd5; --r3:#6b7075;
          --tS:#959ca4; --tW:#d6d1c4; --tJ:#3fb57a; --tZT:#a3b36a; --tK:#58b05b; --tO:#2f7d52;
          --tGold:#f0c040; --tEdge:#1b1b1b;
          --bLand:#1f1f1f; --bWater:#14202a; --bRiver:#1c3142; --bUrban:#292927;
          --bShade:#000000; --bLit:#3a3a3a; --bShadeK:0.45;
          --stFill:#4a4a4a; } }
  #legend { position:absolute; left:10px; bottom:calc(var(--barH, 56px) + 10px); z-index:1000; background:var(--bg); border:1px solid var(--line);
            border-radius:6px; padding:6px 9px; font-size:12px; line-height:1.7; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  #legend i { display:inline-block; width:18px; height:3px; vertical-align:middle; margin-right:6px; border-radius:2px; }
  #auxtip { position:absolute; z-index:1001; display:none; background:var(--bg); color:var(--fg); border:1px solid var(--line);
            border-radius:5px; padding:4px 8px; font-size:12px; box-shadow:0 1px 4px rgba(0,0,0,.2); pointer-events:none; }
  #legend svg { vertical-align:middle; margin:0 6px 0 0; }
  #legLoco svg { margin-right:3px; }
  #legLoco svg + svg { margin-right:6px; }
  #legLoco .lnote { color:var(--muted); font-size:10.5px; }
  #legend .h { color:var(--muted); font-size:11px; margin-top:4px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #legend .h:first-child { margin-top:0; }
  #mkbtn { font:11px system-ui, sans-serif; line-height:1.3; padding:1px 6px; border:1px solid var(--line); border-radius:4px;
           background:none; color:var(--muted); cursor:pointer; }
  #mkbtn:hover { color:var(--fg); border-color:var(--muted); }
  .kd { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:baseline;
        box-sizing:border-box; border:1px solid var(--tEdge); }
  html, body { margin:0; height:100%; font:13px system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  #map { position:absolute; inset:0 0 var(--barH, 56px) 0; }
  #bar { position:absolute; left:0; right:0; bottom:0; height:56px; display:flex; align-items:center; gap:12px; padding:0 14px;
         background:var(--bg); border-top:1px solid var(--line); box-sizing:border-box; }
  #clock { font:600 20px ui-monospace, monospace; min-width:70px; }
  #slider { flex:1; }
  #playbtn { min-width:30px; height:28px; padding:0 6px !important; border:1px solid var(--line); border-radius:4px;
             background:var(--bg); color:var(--fg); cursor:pointer; line-height:1; }
  #playbtn:hover { border-color:var(--muted); }
  #playbtn.on { background:var(--sel); border-color:var(--sel); color:#fff; }
  #spdbox { display:inline-flex; flex-direction:column; justify-content:center; gap:1px; width:96px; user-select:none; }
  #spdtop { display:flex; justify-content:center; align-items:baseline; font-size:11px; line-height:1.15; font-variant-numeric:tabular-nums; white-space:nowrap; }
  #spdval { font-weight:600; color:var(--fg); }
  #spdwrap { position:relative; display:flex; align-items:center; height:16px; }
  #spdticks { position:absolute; inset:0; pointer-events:none; }
  #spdticks i { position:absolute; top:50%; width:2px; height:8px; margin:-4px 0 0 -1px; border-radius:1px;
                background:color-mix(in srgb, var(--fg) 32%, transparent); transition:background .12s, height .12s; }
  #spdticks i.on { background:var(--sel); height:10px; margin-top:-5px; }
  #speed { position:relative; width:100%; margin:0; cursor:pointer; accent-color:var(--sel); background:transparent; }
  #slider.run { accent-color:var(--sel); }
  #bar button, #bar select, #bar input[type=text] { font:inherit; padding:4px 8px; }
  #count { color:var(--muted); min-width:110px; }
  /* 分屏：下半屏嵌运行图（diagram.html），上沿可拖动调高度 */
  #dgwrap { position:absolute; left:0; right:0; bottom:var(--barH, 56px); height:var(--dgH, 45%); display:none; border-top:1px solid var(--line);
            background:var(--bg); z-index:1001; }
  #dgwrap iframe { width:100%; height:100%; border:0; display:block; }
  #dgsplit { position:absolute; left:0; right:0; top:-5px; height:10px; cursor:ns-resize; z-index:2; }
  #dghint { position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); color:var(--muted); pointer-events:none; }
  body.split #dgwrap { display:block; }
  body.split #map { bottom:calc(var(--barH, 56px) + var(--dgH, 45%)); }
  body.split #legend { display:none; }
  body.split #panel { max-height:calc(100% - var(--barH, 56px) - var(--dgH, 45%) - 30px); }
  body.dgdrag iframe { pointer-events:none; }
  #dgbtn { display:inline-flex; align-items:center; gap:4px; cursor:pointer; }
  #dgbtn .chev { width:11px; height:11px; transition:transform .16s ease; }
  #dgbtn.on, #mkbtn.on { color:var(--sel); border-color:var(--sel); background:color-mix(in srgb, var(--sel) 12%, transparent); font-weight:500; }
  #dgbtn.on .chev { transform:rotate(180deg); }
  #panel { position:absolute; top:10px; right:10px; width:312px; max-height:calc(100% - 90px); overflow:hidden; z-index:1000;
           background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px 12px; display:none;
           flex-direction:column; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  #panel > * { flex-shrink:0; }            /* 只让表格收缩，标题、线路、底栏等不被压扁裁掉 */
  #panel > .x { position:absolute; top:10px; right:12px; cursor:pointer; color:var(--muted); font-size:13px; line-height:1; }
  #panel > .x:hover { color:var(--fg); }
  #panel h3 { margin:0 0 4px; font-size:17px; font-weight:700; padding-right:18px; display:flex; align-items:baseline; gap:5px; flex-wrap:wrap; line-height:1.25; }
  #panel h3 .note, #panel h3 .tag, #panel h3 .kb-lim { font-weight:normal; }
  #panel h3 .tag { font-size:11px; padding:1px 4px; margin-left:0; }
  #panel .od-row { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:4px; }
  #panel .od { font-size:14px; font-weight:600; }
  #panel .od .note { font-weight:normal; margin-left:4px; }
  #panel .cam { display:inline-flex; align-items:center; justify-content:center; width:26px; height:22px;
                border:1px solid var(--line); border-radius:5px; cursor:pointer; color:var(--muted); text-decoration:none; flex:none; }
  #panel .cam:hover { color:var(--fg); border-color:var(--muted); }
  #panel .cam.on { background:var(--tJ); border-color:var(--tJ); color:#fff; }
  #panel .runs { display:flex; border-bottom:1px solid var(--line); margin:4px 0 6px; gap:2px; }
  #panel .runs .tab { flex:1; text-align:center; padding:3px 4px 4px; cursor:pointer; border-bottom:2px solid transparent;
                      margin-bottom:-1px; color:var(--muted); text-decoration:none; border-radius:4px 4px 0 0; line-height:1.25; }
  #panel .runs .tab:hover { color:var(--fg); background:color-mix(in srgb, var(--fg) 4%, transparent); }
  #panel .runs .tab.cur { color:var(--sel); border-bottom-color:var(--sel); background:color-mix(in srgb, var(--sel) 6%, transparent); }
  #panel .runs .tab .t-d { display:block; font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }
  #panel .runs .tab .t-s { display:block; font-size:10px; opacity:.85; }
  #panel .stat { background:color-mix(in srgb, var(--fg) 4%, transparent); border:1px solid var(--line); border-radius:4px;
                 padding:5px 8px; margin:4px 0 2px; font-size:12px; line-height:1.45; }
  #panel .tw { flex:1 1 auto !important; min-height:80px; overflow:auto; margin-top:6px; border-top:1px solid var(--line); }
  #panel .tw table { margin-top:0; }
  #panel .tw th { position:sticky; top:0; z-index:1; background:var(--bg); text-align:left; font-weight:normal; color:var(--muted);
                  font-size:11px; padding:3px 4px; box-shadow:0 1px 0 var(--line); white-space:nowrap; }
  #panel .tw th.num, #panel .tw td.num, #panel .kb-sub th.num, #panel .kb-sub td.num { text-align:right; font-variant-numeric:tabular-nums; }
  #panel table { width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; }
  #panel td { padding:3px 4px; border-top:1px solid var(--line); white-space:nowrap; }
  #panel td.main, #panel .kb-sub td:first-child { width:100%; max-width:0; overflow:hidden; text-overflow:ellipsis; }
  #panel tr.past td { color:var(--muted); }
  #panel tr.cur td { font-weight:600; background:color-mix(in srgb, var(--sel) 10%, transparent); }
  #panel tr.next td { font-weight:600; }
  #panel tr.next td:first-child::before { content:"→ "; color:var(--sel); font-weight:700; }
  #panel tr[data-stop] { cursor:pointer; }
  #panel tr[data-stop]:hover td { background:color-mix(in srgb, var(--fg) 5%, transparent); }
  #panel tr[data-stop].cur:hover td { background:color-mix(in srgb, var(--sel) 14%, transparent); }
  #panel a[data-line], #panel a[data-st], #panel a[data-pan], #panel a.back, #panel tr[data-i] a { color:inherit; text-decoration:underline dotted; cursor:pointer; }
  #panel a[data-line]:hover, #panel a[data-st]:hover, #panel a[data-pan]:hover, #panel a.back:hover, #panel tr[data-i] a:hover { color:var(--sel); }
  #panel .tm { cursor:pointer; }
  #panel .tm:hover { text-decoration:underline; color:var(--sel); }
  #panel .tag { white-space:nowrap; font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:3px; padding:0 3px; margin-left:3px; font-variant-numeric:tabular-nums; }
  #panel .warn { color:#d9822b; }
  #panel .sg { white-space:nowrap; font-size:10px; line-height:1.2; color:var(--hl); border:1px solid var(--hl); border-radius:3px; padding:0 2px; margin-left:3px; cursor:help; }
  #panel .foot { margin-top:6px; padding-top:4px; border-top:1px solid var(--line); color:var(--muted); font-size:11px;
                 display:flex; justify-content:space-between; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .more { text-decoration:underline dotted; cursor:help; flex:none; }
  sup.day { font-size:9px; line-height:0; vertical-align:super; margin-left:.5px; font-weight:normal; }
  svg.ext { width:11px; height:11px; vertical-align:-1px; margin-left:1px; opacity:.75; }
  .emu-row { display:flex; align-items:center; gap:5px; margin:1px 0 3px; line-height:1.2; }
  .emu-ico { display:inline-flex; align-items:center; line-height:0; text-decoration:none !important; flex:none; }
  .emu-ico svg { display:block; }
  /* 火车Wiki 客里表符号与接算站标记 */
  u.jsz, #panel a.jsz { color:color-mix(in srgb, var(--fg) 55%, #a82028); text-decoration:underline !important;
                        text-decoration-color:color-mix(in srgb, currentColor 65%, transparent) !important; text-underline-offset:2px; }
  #panel a.jsz:hover { color:var(--sel); }
  .kb-lim { font-family:"Songti SC", "SimSun", system-ui, sans-serif; letter-spacing:.5px; font-size:12px; }
  .kb-lim span { cursor:help; }
  .kb-Post { margin-left:1px; font-weight:600; cursor:help; }
  #panel .kb-bar { display:flex; align-items:center; justify-content:space-between; gap:6px; width:100%; box-sizing:border-box;
                   margin:4px 0 0; padding:3px 7px; font:11.5px system-ui, sans-serif; color:var(--fg); cursor:pointer;
                   background:color-mix(in srgb, var(--fg) 3%, transparent); border:1px solid var(--line); border-radius:4px; text-decoration:none; }
  #panel .kb-bar:hover { border-color:color-mix(in srgb, var(--sel) 50%, var(--line)); }
  #panel .kb-bar.open { border-radius:4px 4px 0 0; background:color-mix(in srgb, var(--sel) 9%, transparent);
                        border-color:color-mix(in srgb, var(--sel) 40%, var(--line)); }
  #panel .kb-bar .kb-l { display:flex; align-items:center; gap:5px; min-width:0; overflow:hidden; }
  #panel .kb-bar .chev { width:11px; height:11px; flex:none; transition:transform .16s ease; }
  #panel .kb-bar.open .chev { transform:rotate(90deg); }
  #panel .kb-bar .kb-sum { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #panel .kb-bar .kb-cnt { color:var(--muted); font-variant-numeric:tabular-nums; flex:none; }
  #panel .kb-sub { width:100%; border-collapse:collapse; font-size:11.5px; margin:0 0 4px; border:1px solid var(--line);
                   border-top:0; border-radius:0 0 4px 4px; overflow:hidden; }
  #panel .kb-sub th { background:color-mix(in srgb, var(--fg) 4%, transparent); color:var(--muted); font-weight:normal;
                      font-size:11px; text-align:left; padding:2px 6px; border-bottom:1px solid var(--line); }
  #panel .kb-sub td { padding:2px 6px; border-top:1px solid var(--line); white-space:nowrap; }
  /* 选中历史：取消选中后右上角显示刚才的对象，点击恢复；▾ 展开最近的历史 */
  #hist { position:absolute; top:10px; right:10px; z-index:1000; display:none; font-size:12px; }
  #hist .grp { display:flex; background:var(--bg); border:1px solid var(--line); border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  #hist button { font:inherit; color:inherit; background:none; border:0; padding:5px 9px; cursor:pointer; white-space:nowrap; }
  #hist button:hover { color:var(--sel); }
  #histBtn { max-width:240px; overflow:hidden; text-overflow:ellipsis; }
  #histDd { border-left:1px solid var(--line) !important; padding:5px 7px !important; }
  #histList { position:absolute; right:0; top:calc(100% + 4px); min-width:220px; max-width:320px; max-height:60vh; overflow:auto;
              background:var(--bg); border:1px solid var(--line); border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.15);
              margin:0; padding:4px 0; list-style:none; display:none; }
  #hist.open #histList { display:block; }
  #histList li { padding:4px 10px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #histList li:hover { background:color-mix(in srgb, var(--sel) 12%, transparent); }
  #histList .k { display:inline-block; min-width:2.6em; color:var(--muted); font-size:11px; }
  #histList .clr { color:var(--muted); font-size:11px; border-top:1px solid var(--line); margin-top:3px; padding-top:5px; }
  #tip { position:absolute; z-index:1001; pointer-events:none; background:var(--bg); border:1px solid var(--line);
         border-radius:4px; padding:3px 7px; display:none; white-space:nowrap; box-shadow:0 1px 4px rgba(0,0,0,.15); font-size:11px; line-height:1.3; }
  #tip b { font-size:11.5px; font-weight:600; }
  #tip .kd { width:7px; height:7px; margin-right:4px; }
  .note { color:var(--muted); font-size:11px; }
  #panel tr.wait td { font-style:italic; color:var(--muted); font-size:11.5px; }
  #panel tr.wait td:first-child { padding-left:8px; }
  #panel tr.wait.cur td { color:var(--fg); font-weight:600; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:2000; background:var(--bg); }
  /* 路网先画出来以后，遮罩缩成顶部的小提示，等列车数据 */
  #loading.mini { inset:auto; top:10px; left:50%; transform:translateX(-50%); padding:4px 12px; border-radius:12px;
                  font-size:12px; color:var(--muted); background:var(--bg); opacity:.9; pointer-events:none; }
  /* 底图淡化：灰度 + 半透明；深色模式反色成暗底 */
  .leaflet-container { background:var(--bg); }
  .leaflet-control-scale-line { background:color-mix(in srgb, var(--bg) 75%, transparent); color:var(--fg);
                                border-color:var(--fg); font-size:11px;
                                text-shadow:none; }   /* Leaflet 默认白色阴影在深色主题下成了重影 */
  #bar label { color:var(--muted); display:flex; align-items:center; gap:4px; }
  /* 日期选择 */
  #datebox { display:flex; align-items:center; gap:4px; flex:none; }
  #datebox button { padding:4px 6px; }
  #datebox button:disabled { opacity:.35; }
  #date option:disabled { color:var(--muted); }
  #dinfo { display:inline-flex; align-items:center; justify-content:center; width:22px; height:22px; border-radius:50%;
           cursor:pointer; flex:none; user-select:none; transition:background .15s, transform .12s; }
  #dinfo:hover { background:color-mix(in srgb, var(--fg) 8%, transparent); transform:scale(1.06); }
  #dinfo svg { width:17px; height:17px; display:block; }
  #dinfo.ok { color:#16a34a; }
  #dinfo.warn { color:#d9822b; }
  #dinfo.err { color:#dc2626; }
  #dpop { position:fixed; z-index:1002; display:none; width:308px; max-width:calc(100vw - 20px);
          background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:8px;
          padding:10px 12px; font-size:12px; line-height:1.5; box-shadow:0 4px 16px rgba(0,0,0,.22); }
  #dpop.open { display:block; }
  #dpop .dp-hd { display:flex; align-items:center; justify-content:space-between; gap:8px;
                 padding-bottom:6px; margin-bottom:6px; border-bottom:1px solid var(--line); }
  #dpop .dp-dt { font-size:13.5px; font-weight:700; }
  #dpop .dp-badge { display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
                    padding:1px 7px; border-radius:10px; }
  #dpop .dp-badge.ok { color:#16a34a; background:color-mix(in srgb, #16a34a 14%, transparent); }
  #dpop .dp-badge.warn { color:#d9822b; background:color-mix(in srgb, #d9822b 16%, transparent); }
  #dpop .dp-badge.err { color:#dc2626; background:color-mix(in srgb, #dc2626 16%, transparent); }
  @media (prefers-color-scheme: dark) {
    #dinfo.ok, #dpop .dp-badge.ok { color:#22c55e; }
    #dinfo.warn, #dpop .dp-badge.warn { color:#f59e0b; }
    #dinfo.err, #dpop .dp-badge.err { color:#ef4444; }
  }
  #dpop .dp-issues { margin:0 0 7px; padding:5px 8px; border-radius:5px; font-size:11.5px; line-height:1.45; }
  #dpop .dp-issues.ok { background:color-mix(in srgb, #16a34a 10%, transparent); border:1px solid color-mix(in srgb, #16a34a 28%, transparent); color:var(--fg); }
  #dpop .dp-issues.warn { background:color-mix(in srgb, #d9822b 12%, transparent); border:1px solid color-mix(in srgb, #d9822b 35%, transparent); color:var(--fg); }
  #dpop .dp-issues.err { background:color-mix(in srgb, #dc2626 12%, transparent); border:1px solid color-mix(in srgb, #dc2626 35%, transparent); color:var(--fg); }
  #dpop .dp-issues div + div { margin-top:2px; }
  #dpop .dp-sec { font-size:10.5px; font-weight:600; color:var(--muted); margin:7px 0 3px; letter-spacing:.3px; border-top:1px dashed var(--line); padding-top:5px; }
  #dpop .dp-sec:first-of-type { margin-top:2px; border-top:0; padding-top:0; }
  #dpop .dp-row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:1.5px 0; font-variant-numeric:tabular-nums; }
  #dpop .dp-k { color:var(--muted); flex:none; }
  #dpop .dp-v { text-align:right; font-weight:500; }
  #dpop .dp-sub { color:var(--muted); font-weight:normal; font-size:11px; }
  #dloading { color:var(--muted); font-size:11px; display:none; }
  /* 窄屏：顶栏收紧，次要控件隐藏，仍放不下时可横向滚动（不撑破页面） */
  @media (max-width: 900px) {
    #bar { gap:6px; padding:0 8px; overflow-x:auto; overflow-y:hidden; }
    #bar > *, #tctl > *, #qwrap { flex:none; }
    #slider { flex:1 0 120px; }
    #zoom, #bar label, #count { display:none; }
    #clock { font-size:16px; min-width:52px; }
  }
  @media (max-width: 560px) {
    #bar { gap:4px; padding:0 6px; }
    #spdbox { width:68px; }
    #q { width:4.5em; }

// 图例图标：随「涂装」开关切换经典五边形与特征涂装 Marker（车尾在左、车头朝右，底边为线路；涂装模式下普速统一用 HXD3D）
function drawLegend() {
  const mapLv = { S: 'CR400AF', W: 'CRH2A', J: 'CR200J1', ZT: 'HXD3D', K: 'HXD3D', O: 'HXD3D' };
  for (const el of document.querySelectorAll('#legend [data-lv]')) {
    const oldSvg = el.querySelector('svg');
    if (oldSvg) oldSvg.remove();
    const lv = el.dataset.lv;
    if (lv === 'ZT' || lv === 'K' || lv === 'O') {
      el.hidden = mkOn;               // 涂装模式下普速改用下面的“等级 × 电力/内燃”机车图例（#legLoco）
      if (mkOn) continue;
    }
    if (mkOn && typeof emuMarkerSvg === 'function') {
      const m = el.dataset.fx ? 'CR400BF' : (mapLv[lv] || 'CR400AF');
      el.insertAdjacentHTML('afterbegin', emuMarkerSvg(m, 1, true));
    } else {
      const emu = EMU.has(lv);
      const body = emu ? 'M1,10.5 L23,10.5 L8.7,2.5 L1,2.5 Z' : 'M2,10 L22,10 A10,7 0 0 0 12,3 L2,3 Z';
      const stripe = el.dataset.fx ? '<path d="M1,10.5 L23,10.5 L15.85,6.5 L1,6.5 Z" fill="var(--tGold)"/>' : '';
      el.insertAdjacentHTML('afterbegin', `<svg width="24" height="12" viewBox="0 0 24 12"><path d="${body}" fill="var(--t${lv})"
        stroke="${emu ? 'var(--tEdge)' : 'none'}" stroke-width="0.8"/>${stripe}</svg>`);
    }
  }
  // 涂装模式的普速机车图例：等级 × 电力/内燃（机型取每日数据 loco_defaults，见 docs/15-普速机车示意.md）
  const ll = $('legLoco');
  if (ll) {
    ll.hidden = !mkOn;
    if (mkOn && typeof emuMarkerSvg === 'function') {
      const dflt = window.LOCO_DEFAULTS || { Z: { E: 'HXD1D', D: 'DF11G' }, T: { E: 'HXD3D', D: 'DF11G' },
                                             K: { E: 'SS9G', D: 'DF4D' }, P: { E: 'HXD3C', D: 'DF4B' } };
      const names = { Z: 'Z 直特', T: 'T 特快', K: 'K 快速', P: '普快·其他' };
      ll.innerHTML = Object.keys(names).filter(g => dflt[g]).map(g =>
        `<div title="${names[g]}：电力区段 ${dflt[g].E}，非电区段 ${dflt[g].D}（示意机型，非实际担当）">`
        + emuMarkerSvg(dflt[g].E, 1, true) + emuMarkerSvg(dflt[g].D, 1, true) + names[g] + '</div>').join('')
        + '<div class="lnote">示意机型 · 左电力 右内燃</div>';
    }
  }
}

// 车次标签避让：选中/悬停的先放；默认位置与已放标签（含车站名）重叠时上下交替挪一行，
// 挪开的标签用细线连回车身；普通标签挪 MAX_TRY 次仍无空位就不画，选中的总会画。
// 帧间记忆防抖：
// 1. 左右朝向防抖（SIDE_HYST）：近南北/浅弯处 lab.x ≈ a.p.x 时锁定上一帧左右侧，避免标签整宽横跳；
// 2. 排序防抢位：同优先级下「上帧已显示 > 偏移量 |dy| 小 > 在屏时间久（born 早）」先放，保证原位(dy=0)车次先占座，
//    不会因数组顺序靠后被移位车次误判原位空闲而周期性互换位置；
// 3. 空间迟滞 + 时间防抖：保持旧槽位用宽松边距（KEEP_PAD），选新槽位用标准边距（NEW_PAD），回原位用严格边距（RET_PAD）
//    且须在当前槽位呆满 HOLD_MS、原位连续空出 RETURN_MS 才回位；被迫换位时优先选同侧就近槽位；
// 4. 显隐防闪烁 + 平滑过渡：短暂被挤掉的标签在 GRACE_MS 内保留记忆，恢复显示需连续空出 SHOW_MS；
//    槽位或朝向变化时对相对车身的偏移做指数阻尼平滑（TAU_MS），消除单帧跳变。
let labMem = new Map(), labMemZoom = null, labAnimRaf = 0;
const trMemKey = tr => tr.c + (tr.od ? '@' + tr.od : '');
function drawTrainLabels(ctx, labels) {
  const z = map.getZoom(), now = performance.now();
  const RETURN_MS = 750, HOLD_MS = 450, SHOW_MS = 180, GRACE_MS = 1500, TAU_MS = 80;
  const SIDE_HYST = 3, KEEP_PAD = -1, NEW_PAD = 0.5, RET_PAD = 2;
  if (z !== labMemZoom) { labMem.clear(); labMemZoom = z; }
  for (const [k, v] of labMem) if (now - v.lastSeen > GRACE_MS) labMem.delete(k);
  if (!labels.length) return;
  const tfs = z <= 10 ? 10 : 11, H = tfs + 2, MAX_TRY = 8, placed = stLabelBoxes.slice();
  const hit = b => placed.some(q => b[0] < q[2] && b[2] > q[0] && b[1] < q[3] && b[3] > q[1]);
  ctx.font = tfs + 'px system-ui'; ctx.textBaseline = 'middle';
  const bg = css('--bg'), fg = css('--fg'), mu = css('--muted');
  const baseCand = [];
  for (let k = 0; k <= MAX_TRY; k++) baseCand.push((k % 2 ? 1 : -1) * Math.ceil(k / 2) * H);   // 0, +H, −H, +2H, −2H …
  for (const it of labels) it.m = labMem.get(it.key = trMemKey(it.a.tr));
  labels.sort((x, y) => x.pri - y.pri
    || ((y.m && y.m.vis ? 1 : 0) - (x.m && x.m.vis ? 1 : 0))
    || ((x.m ? Math.abs(x.m.dy) : 1e9) - (y.m ? Math.abs(y.m.dy) : 1e9))
    || ((x.m ? x.m.born : Infinity) - (y.m ? y.m.born : Infinity)));
  let gliding = false;
  for (const { a, lab, isSel, key, m: old } of labels) {
    const txt = a.tr.c.split('/')[0], w = ctx.measureText(txt).width;
    const sideDx = lab.x - a.p.x;
    const left = old && old.left !== undefined ? (old.left ? sideDx >= -SIDE_HYST : sideDx > SIDE_HYST) : sideDx >= 0;
    const box = (dy, pad = 0) => {
      const x0 = left ? lab.x : lab.x - w, y = lab.y + dy;
      return [x0 - 1 - pad, y - H / 2 - pad, x0 + w + 1 + pad, y + H / 2 + pad];
    };
    let dy, freeSince = null, slotSince = old ? old.slotSince : now;
    if (old && old.vis && !hit(box(old.dy, KEEP_PAD))) {
      dy = old.dy;
      if (dy !== 0 && now - slotSince >= HOLD_MS && !hit(box(0, RET_PAD))) {
        freeSince = old.freeSince ?? now;
        if (now - freeSince >= RETURN_MS) { dy = 0; freeSince = null; slotSince = now; }
      }
    } else {
      const cand = old ? baseCand.slice().sort((d1, d2) =>
        (Math.abs(d1) + 1.15 * Math.abs(d1 - old.dy)) - (Math.abs(d2) + 1.15 * Math.abs(d2 - old.dy))) : baseCand;
      dy = cand.find(d => !hit(box(d, NEW_PAD)));
      if (dy !== undefined && (!old || dy !== old.dy)) slotSince = now;
    }
    if (dy === undefined) {
      if (!isSel) {
        if (old) { old.vis = false; old.showSince = null; old.freeSince = null; old.lastSeen = now; }
        continue;
      }
      dy = old ? old.dy : 0;
    }
    if (!isSel && old && !old.vis) {                        // 刚被挤掉的普通标签需连续空出 SHOW_MS 才重新显示
      const showSince = old.showSince ?? now;
      if (now - showSince < SHOW_MS) {
        old.showSince = showSince; old.dy = dy; old.left = left; old.lastSeen = now;
        continue;
      }
    }
    const targetOx = lab.x - a.p.x, targetOy = lab.y - a.p.y + dy;
    const dt = old && old.vis && old.lastSeen != null ? Math.max(0, now - old.lastSeen) : 999;
    const alpha = (old && old.vis && old.ox !== undefined && dt <= 250) ? (1 - Math.exp(-Math.max(1, dt) / TAU_MS)) : 1;
    let ox = alpha < 1 ? old.ox + (targetOx - old.ox) * alpha : targetOx;
    let oy = alpha < 1 ? old.oy + (targetOy - old.oy) * alpha : targetOy;
    if (Math.hypot(targetOx - ox, targetOy - oy) < 0.2) { ox = targetOx; oy = targetOy; }
    else gliding = true;
    const rx = a.p.x + ox, ry = a.p.y + oy;
    const bTarget = box(dy, 0);
    const rx0 = left ? rx : rx - w, bRender = [rx0 - 1, ry - H / 2, rx0 + w + 1, ry + H / 2];
    placed.push([Math.min(bTarget[0], bRender[0]), Math.min(bTarget[1], bRender[1]),
                 Math.max(bTarget[2], bRender[2]), Math.max(bTarget[3], bRender[3])]);
    labMem.set(key, {
      dy, left, ox, oy, vis: true,
      born: old ? old.born : now,
      slotSince, freeSince, showSince: null, lastSeen: now,
    });
    if (Math.abs(ry - lab.y) >= 1.5) {                      // 引线：车身外侧 → 标签靠车一端
      ctx.beginPath(); ctx.moveTo(lab.x + (left ? -3 : 3), lab.y); ctx.lineTo(rx, ry);
      ctx.lineWidth = 0.8; ctx.strokeStyle = mu; ctx.stroke();
    }
    ctx.textAlign = left ? 'left' : 'right';
    ctx.lineWidth = 3; ctx.strokeStyle = bg; ctx.strokeText(txt, rx, ry);
    ctx.fillStyle = fg; ctx.fillText(txt, rx, ry);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  if (gliding && !playing && !labAnimRaf) {
    labAnimRaf = requestAnimationFrame(() => { labAnimRaf = 0; draw(); });
  }
}

// 不取整的屏幕坐标：latLngToContainerPoint 会取整到像素，缩小时（z5 一像素约 4 km）
// 每帧移动不足一像素的列车会停几帧再跳一像素，看起来一顿一顿的
function toPx(ll) {
  const q = map.project(ll, map.getZoom()), o = map.getPixelOrigin(), tl = map.containerPointToLayerPoint([0, 0]);
  return L.point(q.x - o.x - tl.x, q.y - o.y - tl.y);
}

let active = [];
// ===== 分屏运行图 =====
// 下半屏用 iframe 嵌 diagram.html，通过它的网址锚点（date、line、train、od）切换线路并同步高亮车次：
// 选中客里表线路就显示该线；选中车次时显示它当前所在线路（随车换线）；都没有时保留上一条
let splitOn = false, dgHash = null, dgLine = null, dgPin = null;
// 分屏不记忆：只有网址带 split=1 才打开
function dgLineNow() {
  if (selLine) return selLine;

  if (dgPin && dgPin.tr === sel) return dgPin.line;
  const st = state(sel, T), ln = st && lineAt(sel, st);
  if (ln && (ln.lid || ln.name)) { const lid = ln.lid || kbLineFor(ln.name, sel, st); if (lid) return lid; }
  for (let li = 0; li < sel.l.length; li++) {
    const leg = sel.l[li], segs = leg && D.glines && D.glines[leg[0]];
    if (!segs) continue;
    for (const g of segs) if (g[1] >= 0) {
      const lid = kbLineFor(D.line_names[g[1]], sel, { i: li, li });
      if (lid) return lid;
    }
  }
  return null;
}
function syncDiagram() {
  if (!splitOn) return;
  const lid = dgLineNow() || dgLine;
  if (!lid) { $('dghint').style.display = ''; return; }
  dgLine = lid;
  const tr = sel || lineBackTr;
  const isDefDt = !curDate || (DATES && curDate === DATES.default);
  const lineName = KB && KB.lines[lid] ? KB.lines[lid].n : lid;
  const trPart = tr ? '&' + tr.c.split('/')[0] + (tr.od ? '&od=' + tr.od : '') : '';
  const dtPart = !isDefDt && curDate ? '&date=' + curDate : '';
  const h = `${encodeURIComponent(lineName)}${trPart}${dtPart}`;
  if (h === dgHash) return;
  dgHash = h; $('dghint').style.display = 'none';
  const f = $('dg');
  if (!f.getAttribute('src')) f.src = 'diagram.html#' + h;
  else try { f.contentWindow.location.hash = h; } catch (e) { f.src = 'diagram.html#' + h; }
}
// 地图当前时刻同步给运行图（画一条竖线）：时刻或日期变了才发；运行图页加载完也会来要一次
let dgTimeKey = null;
function syncDgTime(force) {
  if (!splitOn) return;
  const f = $('dg'); if (!f.getAttribute('src') || !f.contentWindow) return;
  const key = curDate + '|' + T;
  if (!force && key === dgTimeKey) return;
  dgTimeKey = key;

}
$('dg').addEventListener('load', () => syncDgTime(true));
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === 'railmap-time-req') syncDgTime(true);
  else if (e.data.type === 'railmap-date' && e.data.date && e.data.date !== curDate) loadDate(e.data.date);
});
function setSplit(on) {
  splitOn = on;

  document.body.classList.toggle('split', on);
  $('dgbtn').classList.toggle('on', on);
  syncDrawer(); document.body.classList.remove('legOpen');
  map.invalidateSize({ animate: false });
  draw();
  if (on) {
    const f = $('dg');
    if (f.getAttribute('src') && f.contentWindow) f.contentWindow.postMessage({ type: 'railmap-fit-sel' }, location.origin);
  }

}
$('dgbtn').onclick = () => setSplit(!splitOn);
// 运行图里点车站名：选中该站并移到地图视野中（保留已选的客里表线路，取消选中的车次）
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== 'railmap-station') return;
  const st = STBY[e.data.name], ll = st ? [st.lat, st.lon] : e.data.ll ? [e.data.ll[1], e.data.ll[0]] : null;
  if (!ll) return;

// 运行图侧栏时刻表点停站/时刻：跳到该站停车或发车时刻，不在视野内则移过去并放大到至少 z10
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data) return;
  if (e.data.type === 'railmap-stop') {
    const tr = e.data.code ? findRun(e.data.code, e.data.od) : sel;
    const o = e.data.name && (STBY[e.data.name] || (AUXBY && AUXBY[e.data.name]));
    const ll = (tr && e.data.i != null && stopLatLng(tr, e.data.i, e.data.wi))
      || (o && [o.lat, o.lon])
      || (e.data.ll && [e.data.ll[1], e.data.ll[0]]) || null;
    if (okNum(e.data.t)) jumpT(e.data.t, ll);
    else if (ll) { panToPos(ll); draw(); }
    return;
  }
  if (e.data.type === 'railmap-jump-t' && okNum(e.data.t)) { jumpT(e.data.t); return; }
  if (e.data.type !== 'railmap-pan') return;
  if (STBY[e.data.name] || (AUXBY && AUXBY[e.data.name])) panToStation(e.data.name);
  else if (e.data.ll) { panToPos([e.data.ll[1], e.data.ll[0]]); draw(); }
});
// 运行图侧栏点“地图”：在地图上选中（高亮）该车次，必要时把时间拨到它运行期间并移到视野中；
// 下半屏运行图保持原线路不跳走（dgPin），直到在地图上换选别的对象
addEventListener('message', e => {
  if (e.origin !== location.origin || !e.data || e.data.type !== 'railmap-train') return;
  const tr = findRun(e.data.code, e.data.od); if (!tr) return;
  dgPin = e.data.line ? { tr, line: e.data.line } : null;
  sel = tr; selSt = null; lineBackTr = null; setLine(null);
  const s0 = tr.s[0][2]; if (s0 != null && (T < s0 || T > tr.s[tr.s.length - 1][1])) setT(s0 + 1);
  const st = state(tr, T);
  if (st && !map.getBounds().contains(st.pos)) map.setView(st.pos, Math.max(map.getZoom(), 8));
  draw();
});
try { const h = localStorage.getItem('railmap.dgH'); if (h) document.body.style.setProperty('--dgH', h); } catch (e) {}
$('dgsplit').addEventListener('pointerdown', e => {
  e.preventDefault(); document.body.classList.add('dgdrag');
  const H = innerHeight - barH(), lo = Math.min(120, H * 0.25);
  const move = ev => { const px = Math.min(H - lo, Math.max(lo, H - ev.clientY));
    document.body.style.setProperty('--dgH', px + 'px'); map.invalidateSize({ animate: false }); };
  const up = () => { document.body.classList.remove('dgdrag'); removeEventListener('pointermove', move); removeEventListener('pointerup', up);
    try { localStorage.setItem('railmap.dgH', getComputedStyle(document.body).getPropertyValue('--dgH').trim()); } catch (e) {}
    draw(); };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
});

// 跟随：车次面板里点“跟随”，每帧把地图中心移到该车；拖动地图、取消或换选车次即停止
let follow = false, drawing = false;
function followSel() {
  if (follow && sel !== followTr) follow = false;
  if (!follow) return;
  const st = state(sel, T); if (!st) return;
  const p = map.latLngToContainerPoint(st.pos), c = map.getSize().divideBy(2);
  c.y -= sheetOcc() / 2;                     // 手机抽屉打开时，跟随点放在露出部分的中央
  if (Math.abs(p.x - c.x) > 0.5 || Math.abs(p.y - c.y) > 0.5) map.panBy([p.x - c.x, p.y - c.y], { animate: false });
}
let followTr = null;

function draw() {
  if (!D || !overlay.ctx || drawing) return;
  syncSlider();
  writeHash();
  drawing = true;
  try { followSel(); drawFrame(); syncDiagram(); syncDgTime(); trackHist(); syncTimeUi(); } finally { drawing = false; }
}
// ===== 选中历史 =====
// 每次重绘比较当前选中对象（车次 / 客里表线路 / 车站）；换了就把上一个记进历史（同一对象只留最新一条，最多 12 条，存 localStorage）。
// 什么都没选中时右上角显示最近一条，点击恢复；▾ 列出全部历史
let HIST = [], histCur = null, histShown = null;

const histKey = h => h ? h.k + ':' + h.v + (h.od ? '@' + h.od : '') : '';
function histNow() {
  if (sel) return { k: 'train', v: sel.c.split('/')[0], od: sel.od || null, label: sel.c, sub: `${sel.s[0][0]} → ${sel.s[sel.s.length - 1][0]}${sel.od ? ' · ' + sel.od.slice(5) + ' 始发' : ''}` };
  if (selLine) return { k: 'line', v: selLine, label: (KB && KB.lines[selLine] && KB.lines[selLine].n) || selLine };
  if (selSt) {
    const kl = KBST[selSt.name] || [];

      try { localStorage.setItem('railmap.hist', JSON.stringify(HIST)); } catch (e) {}
    }
    histCur = now;

  const list = HIST.filter(h => histKey(h) !== key);

  histShown = sig;

  if (!show) { $('hist').classList.remove('open'); return; }

  $('histBtn').title = `恢复选中：${h0.label}${h0.sub ? '（' + h0.sub + '）' : ''}`;
  $('histList').innerHTML = HIST.map((h, i) => `<li data-i="${i}" title="${h.sub || ''}"><span class="k">${HIST_KIND[h.k]}</span>${h.label}${h.sub ? ` <span class="note">${h.sub}</span>` : ''}</li>`).join('')
    + '<li class="clr" data-clr="1">清空历史</li>';

// ===== 视口外框线路方向标记（docs/11 §5.3） =====

    return borderMetaCache;
  }
  const cleanNm = s => String(s || '').replace(/（境）|\(境\)|\s+/g, '');

    const s = STBY[nm]; if (s) return [s.lon, s.lat];

      if (STBY[raw0] && STBY[raw0].n >= 5) return tryUpgradeHub(STBY[raw0]);

        const b = STBY[raw0.slice(0, -1)];

      }
      if (raw0.length >= 2) {
        let bestS = null;
        for (const s of ST) if (s.name.startsWith(raw0) && s.n >= 5 && (!bestS || s.n > bestS.n)) bestS = s;

    if (raw0.endsWith('所') && raw0.length >= 3) {
      for (const cut of [1, 2]) {
        if (raw0.length > cut + 1 && STBY[raw0.slice(0, -cut)]) {

  const metaByLid = {};

    metaByLid[lid] = { lid, name: ln.n, cleanName: cleanLineName, len: ln.len || 0, end0, end1, chain };
  }

  const metaByNi = new Array(KB.rail_names.length).fill(null);

function getBorderCrossings(s, z, bx0, by0, bx1, by1) {
  const rails = railsAt(z);

  if (!bm) return [];
  const c = map.getCenter();
  const key = `${c.lat.toFixed(6)}|${c.lng.toFixed(6)}|${z.toFixed(2)}|${s.x}|${s.y}|${bx1}|${selLine || ''}|${rails.length}`;
  if (borderCrossCache.key === key) return borderCrossCache.items;

  const br = map.containerPointToLatLng([bx1, by1]);
  const W = tl.lng, N = tl.lat, E = br.lng, S = br.lat;
  const origin = map.getPixelOrigin(), topLeft = map.containerPointToLayerPoint([0, 0]);
  const projX = lon => map.project([0, lon], z).x - origin.x - topLeft.x;
  const projY = lat => map.project([lat, 0], z).y - origin.y - topLeft.y;
  const unprojLon = x => map.unproject([x + origin.x + topLeft.x, 0], z).lng;

  const clipExit = (x0, y0, x1, y1) => {
    const dx = x1 - x0, dy = y1 - y0;
    let bestT = 2, edge = -1;
    if (dx > 1e-6 && x1 > bx1) { const t = (bx1 - x0) / dx, y = y0 + t * dy; if (t >= 0 && t <= 1 && y >= by0 && y <= by1 && t < bestT) { bestT = t; edge = 1; } }
    if (dx < -1e-6 && x1 < bx0) { const t = (bx0 - x0) / dx, y = y0 + t * dy; if (t >= 0 && t <= 1 && y >= by0 && y <= by1 && t < bestT) { bestT = t; edge = 3; } }
    if (dy > 1e-6 && y1 > by1) { const t = (by1 - y0) / dy, x = x0 + t * dx; if (t >= 0 && t <= 1 && x >= bx0 && x <= bx1 && t < bestT) { bestT = t; edge = 2; } }
    if (dy < -1e-6 && y1 < by0) { const t = (by0 - y0) / dy, x = x0 + t * dx; if (t >= 0 && t <= 1 && x >= bx0 && x <= bx1 && t < bestT) { bestT = t; edge = 0; } }

    return { ex: x0 + bestT * dx, ey: y0 + bestT * dy, t: bestT, edge };
  };

  for (const r of srcRails) {
    let segMeta = null, niMeta = null;
    if (selLine) {
      if (!hl || !hl.names.has(r.ni)) continue;
      const bb = r.bbox;
      if (bb[2] < hl.bbox[0] || bb[0] > hl.bbox[2] || bb[3] < hl.bbox[1] || bb[1] > hl.bbox[3]) continue;
      segMeta = bm.metaByLid[selLine];
      if (!segMeta) continue;
    } else {
      if (r.cls > 2 && z < 10) continue;
      niMeta = bm.metaByNi[r.ni];
      if (!niMeta || niMeta.totLen < minLen) continue;
    }
    const bb = r.bbox;
    if (bb[2] < W || bb[0] > E || bb[3] < S || bb[1] > N) continue;
    if (bb[0] > W && bb[2] < E && bb[1] > S && bb[3] < N) continue;

    const p = r.pts, nPts = p.length >> 1;
    let prevX = projX(p[0]), prevY = projY(p[1]);
    let prevIn = prevX >= bx0 && prevX <= bx1 && prevY >= by0 && prevY <= by1;

    for (let i = 1; i < nPts; i++) {
      const curX = projX(p[2 * i]), curY = projY(p[2 * i + 1]);
      const curIn = curX >= bx0 && curX <= bx1 && curY >= by0 && curY <= by1;
      if (prevIn !== curIn) {
        const inIdx = prevIn ? i - 1 : i, outIdx = prevIn ? i : i - 1;
        const step = prevIn ? 1 : -1;
        const xIn = prevIn ? prevX : curX, yIn = prevIn ? prevY : curY;

          }
          let axOut = xOut, ayOut = yOut, lonOut = p[2 * outIdx], latOut = p[2 * outIdx + 1];
          for (let k = outIdx + step; k >= 0 && k < nPts; k += step) {
            const kx = projX(p[2 * k]), ky = projY(p[2 * k + 1]);
            axOut = kx; ayOut = ky; lonOut = p[2 * k]; latOut = p[2 * k + 1];
            if (Math.hypot(kx - hit.ex, ky - hit.ey) >= 38) break;
          }
          const vx = axOut - axIn, vy = ayOut - ayIn, vLen = Math.hypot(vx, vy);

                  let bestSegD = Infinity;
                  for (const sm of niMeta.segments) {
                    for (const pt of sm.chain) {
                      const d = Math.hypot((pt[0] - lonE) * cosLat, pt[1] - latE);
                      if (d < bestSegD) { bestSegD = d; activeSeg = sm; }
                    }
                  }
                }
              }
              if (activeSeg) {
                const ch = activeSeg.chain;
                let sx = (activeSeg.end1.lon - activeSeg.end0.lon) * cosLat, sy = activeSeg.end1.lat - activeSeg.end0.lat;
                if (ch.length >= 2) {
                  let bestK = 0, bestKD = Infinity;
                  for (let k = 0; k < ch.length - 1; k++) {
                    const mx = (ch[k][0] + ch[k + 1][0]) * 0.5, my = (ch[k][1] + ch[k + 1][1]) * 0.5;
                    const d = Math.hypot((mx - lonE) * cosLat, my - latE);

                  const dsx = (ch[k1][0] - ch[k0][0]) * cosLat, dsy = ch[k1][1] - ch[k0][1];
                  if (Math.hypot(dsx, dsy) > 1e-4) { sx = dsx; sy = dsy; }
                }
                const towardsEnd1 = (gvx * sx + gvy * sy) >= 0;
                let targetEnd = towardsEnd1 ? activeSeg.end1 : activeSeg.end0;
                let otherEnd = towardsEnd1 ? activeSeg.end0 : activeSeg.end1;
                if (!selLine && niMeta && niMeta.segments.length > 1) {
                  const segDx = (activeSeg.end1.lon - activeSeg.end0.lon) * cosLat, segDy = activeSeg.end1.lat - activeSeg.end0.lat;
                  const corDx = (niMeta.corridorEnd1.lon - niMeta.corridorEnd0.lon) * cosLat, corDy = niMeta.corridorEnd1.lat - niMeta.corridorEnd0.lat;
                  const samePolarity = (segDx * corDx + segDy * corDy) >= 0;
                  const pickCor1 = towardsEnd1 ? samePolarity : !samePolarity;
                  targetEnd = pickCor1 ? niMeta.corridorEnd1 : niMeta.corridorEnd0;
                  otherEnd = pickCor1 ? niMeta.corridorEnd0 : niMeta.corridorEnd1;
                }
                const lineName = selLine ? activeSeg.name : (niMeta.segments.length > 1 ? niMeta.dispName : activeSeg.cleanName);
                // 若该方向终点站本身已在当前地图视野内（或距出框点 < 3.5 km），不标出框方向
                const endInView = targetEnd.lon >= W && targetEnd.lon <= E && targetEnd.lat >= S && targetEnd.lat <= N;
                const distToEndKm = Math.hypot((targetEnd.lon - lonE) * cosLat * 111, (targetEnd.lat - latE) * 111);
                if (!endInView && distToEndKm >= 3.5) {
                  rawCrossings.push({
                    ex: hit.ex, ey: hit.ey, ux, uy, edge: hit.edge,
                    cls: r.cls, single: r.single || 0, ni: r.ni,
                    lid: activeSeg.lid,
                    lineName,
                    dirName: targetEnd.name,
                    fromName: otherEnd.name,
                    totLen: selLine ? activeSeg.len : niMeta.totLen,
                    distToEndKm,

                }
              }
            }
          }
        }
      }
      prevX = curX; prevY = curY; prevIn = curIn;

  // 同线路 + 同方向在相近位置（85 px 内）的多股道交点聚类合并；若同一方向沿边框进出多次，只取离该终点最近的一处出框交点
  const groups = new Map();
  for (const c of rawCrossings) {
    const gk = c.lineName + '|' + c.dirName;
    let list = groups.get(gk); if (!list) groups.set(gk, list = []);
    const near = list.find(m => Math.hypot(m.ex - c.ex, m.ey - c.ey) < 85);
    if (!near) {
      list.push({ ...c, wSum: c.single ? 0.6 : 1, exSum: c.ex * (c.single ? 0.6 : 1), eySum: c.ey * (c.single ? 0.6 : 1), uxSum: c.ux * (c.single ? 0.6 : 1), uySum: c.uy * (c.single ? 0.6 : 1) });
    } else {
      const w = c.single ? 0.6 : 1;
      near.wSum += w; near.exSum += c.ex * w; near.eySum += c.ey * w;
      near.uxSum += c.ux * w; near.uySum += c.uy * w;
      near.ex = near.exSum / near.wSum; near.ey = near.eySum / near.wSum;
      const ul = Math.hypot(near.uxSum, near.uySum) || 1;
      near.ux = near.uxSum / ul; near.uy = near.uySum / ul;
      if (c.cls < near.cls) near.cls = c.cls;
      if (!c.single) near.single = 0;
      if (c.distToEndKm < near.distToEndKm) near.distToEndKm = c.distToEndKm;
    }
  }
  const merged = [];
  for (const list of groups.values()) {
    list.sort((a, b) => a.distToEndKm - b.distToEndKm);
    merged.push(list[0]);
  }
  borderCrossCache = { key, items: merged };
  return merged;
}

function drawBorderLines(ctx, s) {

// ===== 日期：map_dates.json 清单 + 每天一个 map_data_<日期>.json =====
// 清单取不到时回退到单文件 map_data.json（不显示日期选择）
let DATES = null, curDate = null, switching = false, loadSeq = 0, firstInit = true, dateLoadErr = null;
const dateEntry = d => DATES && DATES.dates.find(x => x.date === d);
const selectable = () => DATES ? DATES.dates.filter(x => x.selectable && x.file) : [];
const nextDay = d => { const t = new Date(d + 'T00:00:00Z'); t.setUTCDate(t.getUTCDate() + 1); return t.toISOString().slice(0, 10); };
const WD = '日一二三四五六';
const dateLabel = d => `${d.slice(5)} 周${WD[new Date(d + 'T00:00:00Z').getUTCDay()]}`;
const DICO_CHECK = '<svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.5" fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="1.5"/><path d="M5.3 9.3l2.4 2.4 5-5.1" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const DICO_BANG = '<svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7.5" fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="1.5"/><path d="M9 5.2v4.6M9 12.6h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const fmtN = v => v == null ? '—' : Number(v).toLocaleString('zh-CN');
const pctStr = (a, b, dp = 1) => b > 0 && a != null ? `${(a / b * 100).toFixed(dp)}%` : '—';

function computeLiveMetrics() {
  if (!D || !D.trains || D.split) return null;
  if (D._liveMetrics && (D._liveMetricsKb || !KB)) return D._liveMetrics;
  const glines = D.glines || [], gmember = D.gmember || [], lnames = D.line_names || [];
  const geomAba = new Uint8Array(glines.length), geomKb = new Uint8Array(glines.length);
  let kbSet = null;
  if (KB && KB.lines) {
    kbSet = new Set();
    for (const ln of Object.values(KB.lines)) for (const nm of (ln.osm || [])) kbSet.add(nm);
  }
  const kbLids = kbSet ? new Set(lnames.map((nm, i) => kbSet.has(nm) ? i : -1).filter(i => i >= 0)) : null;
  for (let gi = 0; gi < glines.length; gi++) {
    const gl = glines[gi] || [], seen = new Set();
    let prev = -1, aba = 0, hasKb = 0;
    for (let k = 0; k < gl.length; k++) {
      const lid = gl[k][1];
      if (lid >= 0) {
        if (lid !== prev) { if (seen.has(lid)) aba = 1; seen.add(lid); prev = lid; }
        if (kbLids && kbLids.has(lid)) hasKb = 1;
      }
    }
    if (aba) geomAba[gi] = 1;
    const gm = gmember[gi];
    if (!hasKb && gm) for (let k = 0; k < gm.length; k++) if (gm[k][1] >= 0) { hasKb = 1; break; }
    if (hasKb) geomKb[gi] = 1;
  }
  let trains = 0, overnight = 0, emu_trains = 0, emu_with_model = 0, loco_inferred = 0;
  let legs = 0, waits_total = 0, waits_trains = 0, waits_overtake = 0, waits_cross = 0, waits_tech = 0, pass_calibrated = 0;
  let aba_legs = 0, kb_legs = 0, kb_trains = 0;
  for (const t of D.trains) {
    if (t.od) { overnight++; continue; }
    trains++;
    const h = (t.c || '')[0];
    if ((t.tier && t.tier >= 160) || h === 'G' || h === 'D' || h === 'C' || h === 'S') emu_trains++;
    if (t.m) emu_with_model++;
    else if (t.lc) loco_inferred++;
    let hasW = false, allKb = true, hasLeg = false;
    for (const lg of (t.l || [])) {
      if (!lg) continue;
      hasLeg = true; legs++;
      const gi = lg[0];
      if (geomAba[gi]) aba_legs++;
      if (geomKb[gi]) kb_legs++; else allKb = false;
      if (lg[5]) for (const w of lg[5]) {
        const r = w[4] || '';
        if (r === '通过校准') pass_calibrated++;
        else {
          waits_total++; hasW = true;
          if (r.startsWith('待避')) waits_overtake++;
          else if (r.startsWith('会车')) waits_cross++;
          else if (r.startsWith('技术停车')) waits_tech++;
        }
      }
    }
    if (hasW) waits_trains++;
    if (hasLeg && allKb) kb_trains++;
  }
  D._liveMetrics = {
    trains, overnight, stations: (D.stations || []).length, legs,
    emu_trains, emu_with_model, loco_inferred,
    waits_total, waits_trains, waits_overtake, waits_cross, waits_tech, pass_calibrated,
    aba_legs, ...(kbSet ? { kb_trains, kb_legs } : {}),
    ...(D.sgl ? { single_legs: Object.keys(D.sgl).length } : {}),
  };
  D._liveMetricsKb = !!kbSet;
  return D._liveMetrics;
}

function renderDateBox() {
  if (!DATES) { $('datebox').style.display = 'none'; return; }
  $('datebox').style.display = '';
  const sel_ = $('date');
  sel_.innerHTML = DATES.dates.map(x => {
    const ok = x.selectable && x.file;
    const txt = `${dateLabel(x.date)}${ok ? (x.trains != null ? ` · ${x.trains} 趟` : '') : `（${x.reason || '无数据'}）`}`;
    return `<option value="${x.date}"${ok ? '' : ' disabled'} title="${ok ? '' : (x.reason || '无数据')}">${txt}</option>`;
  }).join('');
  sel_.value = curDate || '';
  const ss = selectable(), i = ss.findIndex(x => x.date === curDate);
  $('dprev').disabled = i <= 0; $('dnext').disabled = i < 0 || i >= ss.length - 1;
  renderDateInfo();
}

function renderDateInfo() {
  const e = (curDate && dateEntry(curDate)) || {};
  const m = { ...(e.metrics || {}), ...(computeLiveMetrics() || {}) };
  const n = m.trains ?? e.trains ?? (D && D.trains ? D.trains.filter(t => !t.od).length : null);
  const partial = (e.list_status || (D && D.list_status)) === 'partial';
  const failedN = e.list_failed || 0;
  const miss = e.missing_schedules ?? (D && D.missing && D.missing.no_schedule) ?? 0;
  const noPath = e.no_path ?? (D && D.missing && D.missing.no_path) ?? 0;
  const prevInf = !!(e.prev_inferred ?? (D && D.prev_inferred));

  const issues = [];
  if (dateLoadErr) issues.push({ lv: 'err', text: dateLoadErr });
  if (e.selectable === false) issues.push({ lv: 'err', text: e.reason || '该日期不可用' });
  if (partial || failedN > 0) {
    issues.push({
      lv: failedN >= 5 ? 'err' : 'warn',
      text: `车次列表不完整${failedN ? ` · ${failedN} 个车次搜索前缀失败` : ''}`,
    });
  }
  if (miss > 0) {
    issues.push({
      lv: (e.missing_ratio >= 0.05 || miss >= 100) ? 'err' : 'warn',
      text: `缺停站时刻表 ${fmtN(miss)} 趟${e.missing_ratio != null ? `（${(e.missing_ratio * 100).toFixed(1)}%）` : ''}`,
    });
  }
  if (noPath > 0) {
    issues.push({ lv: noPath >= 20 ? 'err' : 'warn', text: `${fmtN(noPath)} 趟车无法定位路径，未绘制` });
  }
  if (prevInf) {
    issues.push({ lv: 'warn', text: '凌晨跨夜在途车为推定（沿用当天开行名单）' });
  }
  if (m.emu_trains > 0 && m.emu_with_model != null) {
    const emuCov = m.emu_with_model / m.emu_trains;
    if (emuCov < 0.5) issues.push({ lv: 'err', text: `动车组实际编组/车型数据缺失（覆盖率 ${(emuCov * 100).toFixed(1)}%）` });
    else if (emuCov < 0.85) issues.push({ lv: 'warn', text: `部分动车组缺少实际编组/车型数据（覆盖率 ${(emuCov * 100).toFixed(1)}%）` });
  }
  for (const x of e.notes || []) {
    if (x.includes('车次搜索前缀失败') || x.includes('无法定位路径')) continue;
    issues.push({ lv: 'warn', text: x });
  }

  const lv = issues.some(x => x.lv === 'err') ? 'err' : issues.length > 0 ? 'warn' : 'ok';
  const el = $('dinfo');
  el.className = lv;
  el.innerHTML = lv === 'err' ? DICO_BANG : DICO_CHECK;
  el.removeAttribute('title');

  const dtStr = curDate ? `${curDate} 周${WD[new Date(curDate + 'T00:00:00Z').getUTCDay()]}` : (D && D.date) || '当期数据';
  const badgeTxt = lv === 'ok' ? '✓ 数据正常' : lv === 'warn' ? '✓ 轻微问题' : '! 存在异常';
  const issueBox = issues.length
    ? `<div class="dp-issues ${lv}">${issues.map(x => `<div>• ${x.text}</div>`).join('')}</div>`
    : `<div class="dp-issues ok"><div>✓ 车次列表、停站时刻表与跨夜在途车均完整</div></div>`;

  const rows1 = [];
  if (n != null) {
    rows1.push(`<div class="dp-row"><span class="dp-k">开行车次</span><span class="dp-v">${fmtN(n)} 趟${m.overnight != null ? ` <span class="dp-sub">（+跨夜 ${fmtN(m.overnight)} 趟 · ${fmtN(m.stations)} 站）</span>` : ''}</span></div>`);
  }
  if (m.emu_with_model != null && n != null) {
    rows1.push(`<div class="dp-row"><span class="dp-k">实际编组/车型</span><span class="dp-v">${fmtN(m.emu_with_model)} / ${fmtN(n)} 趟 <span class="dp-sub">（动车组 ${pctStr(m.emu_with_model, m.emu_trains)}）</span></span></div>`);
  }
  if (m.loco_inferred != null) {
    rows1.push(`<div class="dp-row"><span class="dp-k">普速推断机车</span><span class="dp-v">${fmtN(m.loco_inferred)} 趟 <span class="dp-sub">（按电气化与等级）</span></span></div>`);
  }

  const rows2 = [];
  if (m.waits_total != null) {
    rows2.push(`<div class="dp-row"><span class="dp-k">推导途中停车</span><span class="dp-v">${fmtN(m.waits_total)} 次 <span class="dp-sub">（涉及 ${fmtN(m.waits_trains)} 趟列车）</span></span></div>`);
    rows2.push(`<div class="dp-row"><span class="dp-k">停车原因分布</span><span class="dp-v"><span class="dp-sub">待避</span> ${fmtN(m.waits_overtake)} · <span class="dp-sub">会车</span> ${fmtN(m.waits_cross)} · <span class="dp-sub">技术停</span> ${fmtN(m.waits_tech)}</span></div>`);
  }
  if (m.pass_calibrated != null) {
    rows2.push(`<div class="dp-row"><span class="dp-k">通过时刻校准</span><span class="dp-v">${fmtN(m.pass_calibrated)} 次 <span class="dp-sub">（越行时间窗约束）</span></span></div>`);
  }

  const rows3 = [];
  if (m.kb_trains != null && n != null) {
    rows3.push(`<div class="dp-row"><span class="dp-k">客里表线路覆盖</span><span class="dp-v">${fmtN(m.kb_trains)} / ${fmtN(n)} 趟 <span class="dp-sub">（${pctStr(m.kb_trains, n)} · 区间 ${pctStr(m.kb_legs, m.legs)}）</span></span></div>`);
  }
  if (m.kb_rerouted != null && m.legs != null) {
    rows3.push(`<div class="dp-row"><span class="dp-k">客里表事后纠偏</span><span class="dp-v">${fmtN(m.kb_rerouted)} / ${fmtN(m.legs)} 段 <span class="dp-sub">（初算一致 ${pctStr(m.legs - m.kb_rerouted, m.legs)}）</span></span></div>`);
  }
  if (m.aba_legs != null && m.legs != null) {
    rows3.push(`<div class="dp-row"><span class="dp-k">离线上线跳线 (A→B→A)</span><span class="dp-v">${fmtN(m.aba_legs)} / ${fmtN(m.legs)} 段 <span class="dp-sub">（${pctStr(m.aba_legs, m.legs, 2)}）</span></span></div>`);
  }
  if (m.sharp_turn_legs != null && m.legs != null) {
    rows3.push(`<div class="dp-row"><span class="dp-k">区间内 ≥135° 折返</span><span class="dp-v">${fmtN(m.sharp_turn_legs)} / ${fmtN(m.legs)} 段 <span class="dp-sub">（${pctStr(m.sharp_turn_legs, m.legs, 2)}）</span></span></div>`);
  }
  if (m.single_legs != null) {
    rows3.push(`<div class="dp-row"><span class="dp-k">单线运行区间</span><span class="dp-v">${fmtN(m.single_legs)} 段${m.single_conflicts != null ? ` <span class="dp-sub">（残余冲突 ${fmtN(m.single_conflicts)} 处）</span>` : ''}</span></div>`);
  }

  $('dpop').innerHTML = `<div class="dp-hd"><span class="dp-dt">${dtStr}</span><span class="dp-badge ${lv}">${badgeTxt}</span></div>`
    + issueBox
    + (rows1.length ? `<div class="dp-sec">列车与编组</div>${rows1.join('')}` : '')
    + (rows2.length ? `<div class="dp-sec">运行图推导</div>${rows2.join('')}` : '')
    + (rows3.length ? `<div class="dp-sec">寻路与路网质量指标</div>${rows3.join('')}` : '');
}

// 加载某日数据：保留时刻 T 与视野；选中的车次按车次号在新数据里重找，车站/线路照旧
// partialT：首次加载时给出初始时刻；落在首片时段内就先用首片画首屏，其余片到了再整份重新初始化（选中按车次接续）
async function loadDate(date, partialT = null) {
  const e = dateEntry(date);
  if (!e || !e.selectable || !e.file) return false;
  if (date === curDate && D) return true;
  const seq = ++loadSeq;
  dateLoadErr = null;
  switching = true; $('dloading').style.display = ''; $('date').disabled = true;
  try {
    let data = await expandGeo(await fetchJson(e.file));
    if (seq !== loadSeq) return false;              // 期间又切了别的日期
    const sp = data.split;
    if (sp) {
      const restP = fetchJson(sp.rest);
      restP.catch(() => {});
      if (partialT != null && partialT >= sp.t[0] && partialT <= sp.t[1]) {
        curDate = date;
        initData(data);
        restP.then(rest => {
          if (seq !== loadSeq) return;
          initData(mergeRest(data, rest));
          if (!switching) $('dloading').style.display = 'none';
        }).catch(() => { if (seq === loadSeq) { dateLoadErr = `${date} 其余车次加载失败`; renderDateInfo(); } });
        return true;
      }
      data = mergeRest(data, await restP);
      if (seq !== loadSeq) return false;
    }
    curDate = date;
    initData(data);
    return true;
  } catch (err) {
    if (seq === loadSeq) { dateLoadErr = `${date} 加载失败`; renderDateInfo(); }
    return false;
  } finally {
    if (seq === loadSeq) {
      switching = false; $('date').disabled = false; renderDateBox();
      if (!D || !D.split) $('dloading').style.display = 'none';   // 首片先画的，其余片到了再藏
      if (hashReady) { saveView(); writeHash(true); }
    }
  }
}

// 用一份 map_data 初始化（首次与切换日期共用）；清掉与旧数据绑定的状态
// contRoll：播放跨过 24:00 自动切到下一天（时间连续）。此时选中/跟随的列车按（车次，始发日期）在新数据里接续；
// 手动换日期时时刻不连续，按车次重找（优先该时刻在跑的那列）
let contRoll = false;
function initData(data) {
  const selCode = sel ? sel.c.split('/')[0] : null, selOd = sel && D ? runOd(sel) : null,
        selStName = selSt ? selSt.name : null, wasFollow = follow, sameDate = D && data.date === D.date;
  D = data;
  G = D._G || D.geoms.map(g => ({
    km: Float64Array.from(g, p => p[0]),
    lon: Float64Array.from(g, p => p[1]),
    lat: Float64Array.from(g, p => p[2]),
    ele: g[0] && g[0].length > 3 ? Int16Array.from(g, p => p[3]) : null,
  }));
  const byName = {};
  ST = (D.stations || []).map(([name, lon, lat, n, code, ele]) => (byName[name] = { name, lon, lat, lon0: lon, lat0: lat, n, code, ele: ele ?? null, ev: [] }));
  ST.sort((a, b) => a.n - b.n);      // 大站后画，压在上面
  for (const tr of D.trains) tr.lv = liveryOf(tr);
  window.LOCO_DEFAULTS = D.loco_defaults || null;     // 普速示意机车：缺图标时的等级默认机型（emu_icons.js locoForTrain）
  const fxRow = document.querySelector('#legend [data-fx]'); if (fxRow) fxRow.hidden = !D.trains.some(t => t.fx);
  // beg / end：始发、终到站。数据里终到站的“发”也填了时刻（= 到），始发站可能填了“到”，按站序判断
  for (const tr of D.trains) {
    tr.s.forEach(([name, a, d], i) => { if (byName[name]) byName[name].ev.push({ tr, a, d, beg: i === 0, end: i === tr.s.length - 1 }); });
    for (const leg of tr.l) if (leg && leg[5]) for (const w of leg[5])
      if (w[4] && w[4].startsWith('技术停车') && byName[w[3]]) byName[w[3]].ev.push({ tr, a: w[1], d: w[2], wait: w[4], why: w[5] });
  }
  stationAxes(byName);
  STBY = byName;
  cityBases();
  hlCache.clear();                   // 线路高亮范围按车站位置算，车站随数据变
  hover = null; active = []; stShown = []; stLabelBoxes = []; if (!sameDate && !contRoll) { labMem.clear(); stopPushMem.clear(); }
  focus = focusSel = focusSt = null;
  // 跨日接续：新数据里没有这列（午夜前已到站）就取消选中，不跳到别的车
  sel = selCode ? (contRoll ? runsOf(selCode).find(tr => runOd(tr) === selOd) || null : findRun(selCode)) : null;
  selSt = selStName ? STBY[selStName] || null : null;
  follow = wasFollow && !!sel; followTr = follow ? sel : null;
  if (!sel && !selSt && !selLine) $('panel').style.display = 'none';
  document.title = `列车位置地图 · ${curDate || D.date}`;
  if (DATES) renderDateInfo();
  if (firstInit) { firstInit = false; firstSetup(); }
  else { if (railLayer.c) railLayer.redraw(); draw(); }
  setTimeout(upgradeGeo, 0);         // 首屏画完再下载精细几何，不和首屏抢带宽
}

// 加载顺序（首屏优先）：map_dates.json → 粗糙路网（到了立刻画、撤掉遮罩）→ 粗糙几何 + 当日首片 → 画列车后再拉客里表、
// 其余车次、精细几何；精细路网放大过 RAILS_LO_MAXZ 才拉
let kbPromise = null, railsPromise = null;
function startRailsFetch() {
  if (railsPromise) return railsPromise;
  railsPromise = fetch((DATES && (DATES.rails_lo || DATES.rails)) || 'map_rails.json', { priority: 'high' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(rj => {
      const { rails, aux, lo } = parseRails(rj);
      RAILS_LO = rails;
      if (!lo) { RAILS_HI = rails; AUX = aux; AUXBY = Object.fromEntries(AUX.map(a => [a.name, a])); }       // 只有一版（本地未打包）
      railLayer.addTo(map);
      // 路网画布放在列车画布下面（列车画布可能还没加）
      if (overlay.c && overlay.c.parentNode) map.getPanes().overlayPane.insertBefore(railLayer.c, overlay.c);
      const ld = $('loading');
      if (ld && !D) { ld.classList.add('mini'); ld.textContent = '加载列车数据…'; }
    });
  railsPromise.catch(() => {});
  return railsPromise;
}
function startSharedFetches() {
  startRailsFetch();
  if (!kbPromise) kbPromise = fetch((DATES && DATES.kelibiao) || 'map_kelibiao.json').then(r => r.ok ? r.json() : null).catch(() => null);
}

// 只做一次：图例、客里表、路网底图、时刻恢复、动画
function firstSetup() {
  drawLegend();
  startSharedFetches();
  kbPromise.then(kb => {
    if (!kb) return;
    KB = kb; KBST = {};
    for (const [lid, ln] of Object.entries(KB.lines)) {
      const byZx = {};
      for (const [, km, zx] of ln.st) if (km != null) {
        const b = byZx[zx] || (byZx[zx] = { k0: km, k1: km });
        if (km < b.k0) b.k0 = km;
        if (km > b.k1) b.k1 = km;
      }
      for (const [name, km, zx, flag, lim, ju, code] of ln.st) {
        const b = byZx[zx];
        const d0 = km != null && b ? Math.round(Math.abs(km - b.k0) * 10) / 10 : null;
        const d1 = km != null && b ? Math.round(Math.abs(b.k1 - km) * 10) / 10 : null;
        (KBST[name] ||= []).push({ lid, km, d0, d1, zx, flag, lim: lim || '', ju: ju || '', code: code || '' });
      }
    }
    for (const v of Object.values(KBST)) v.sort((a, b) => (b.flag & 1) - (a.flag & 1) || KB.lines[a.lid].n.localeCompare(KB.lines[b.lid].n, 'zh'));
    if (DATES) renderDateInfo();
    if (pendingHash) { pendingHash = false; readHash(); } else draw();
  }).catch(() => {});
  overlay.addTo(map);                // 路网画布若已在，列车画布追加在它后面，正好压在上面
  $('loading').remove();
  setT(saved && okNum(saved.t) && saved.t >= 0 && saved.t <= 1440 ? saved.t : 480); readHash(); requestAnimationFrame(tick);
}

(async () => {
  try {
    const r = await fetch('map_dates.json', { cache: 'no-cache' });
    if (r.ok) { const m = await r.json(); if (m && Array.isArray(m.dates) && m.dates.some(x => x.selectable && x.file)) DATES = m; }
  } catch (e) {}
  // 先只拉粗糙路网（约 0.2 MB），到了（或失败）再拉列车数据，不和它抢带宽
  await Promise.race([startRailsFetch().catch(() => {}), new Promise(r => setTimeout(r, 4000))]);
  if (DATES && DATES.geo) preloadGeo(DATES.geo);
  if (!DATES) {                      // 回退：单文件
    const data = await expandGeo(await (await fetch('map_data.json')).json());
    curDate = null; initData(data); return;
  }
  // 起始日期：锚点 > 本机记忆 > 清单默认 > 最后一个可选日期
  const ok = d => d && dateEntry(d) && dateEntry(d).selectable && dateEntry(d).file;
  const ss = selectable();
  const start = [parseHash().date, saved && saved.date, DATES.default].find(ok) || ss[ss.length - 1].date;
  renderDateBox();
  // 初始时刻（同 firstSetup + readHash）；锚点指定了车次/车站/线路时要整天数据才找得到，不用首片
  const h0 = parseHash();
  const t0 = h0.kind || h0.unresolved ? null
    : h0.time ?? (saved && okNum(saved.t) && saved.t >= 0 && saved.t <= 1440 ? saved.t : 480);
  if (!(await loadDate(start, t0))) $('loading').textContent = `${start} 数据加载失败`;
})();
</script></body></html>
