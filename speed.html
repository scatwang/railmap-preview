<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>推定限速地图</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<script src="vendor/maplibre-gl.js"></script>
<style>
  /* 配色沿用 map.html：浅色 / 深色两套，底图颜色取 CSS 变量 */
  :root { --bg:#fff; --fg:#222; --muted:#777; --line:#ddd; --sel:#e6007e; --hl:#0891b2;
          --rail:#b9b6ae; --railHi:#9d9a92; --none:#9aa0a6;
          --bLand:#f3f2ee; --bWater:#c6d9e6; --bRiver:#a9c6dc; --bUrban:#e4e1da;
          --bShade:#5f5a50; --bLit:#ffffff; --bShadeK:0.35; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1b1b; --fg:#e6e6e6; --muted:#9a9a9a; --line:#3a3a3a; --sel:#ff4fc0; --hl:#22d3ee;
          --rail:#4a4a48; --railHi:#5a5a57; --none:#6b7075;
          --bLand:#1f1f1f; --bWater:#14202a; --bRiver:#1c3142; --bUrban:#292927;
          --bShade:#000000; --bLit:#3a3a3a; --bShadeK:0.45; } }
  html, body { margin:0; height:100%; overflow:hidden; font:13px system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  #map { position:absolute; inset:0; }
  .box { background:var(--bg); border:1px solid var(--line); border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.12); box-sizing:border-box; }
  #ctl { position:absolute; left:10px; top:10px; z-index:2; width:330px; max-width:calc(100vw - 20px); padding:8px 10px; }
  #ctl h1 { margin:0; font-size:16px; font-weight:700; display:flex; align-items:center; gap:8px; }
  #ctl h1 .fold { margin-left:auto; font:11px system-ui, sans-serif; padding:1px 6px; border:1px solid var(--line); border-radius:4px;
                  background:none; color:var(--muted); cursor:pointer; }
  #ctl .sub { color:var(--muted); font-size:11.5px; margin:2px 0 6px; line-height:1.4; }
  #ctl.folded .body { display:none; }
  #ctl.folded .sub { margin-bottom:0; }
  .modes { display:flex; gap:0; border:1px solid var(--line); border-radius:5px; overflow:hidden; margin-bottom:6px; }
  .modes button { flex:1; font:12px system-ui, sans-serif; padding:4px 2px; border:0; border-left:1px solid var(--line); background:none;
                  color:var(--fg); cursor:pointer; white-space:nowrap; }
  .modes button:first-child { border-left:0; }
  .modes button.on { background:var(--sel); color:#fff; }
  .row { display:flex; align-items:center; gap:6px; margin:4px 0; flex-wrap:wrap; }
  #q { flex:1; min-width:0; font:inherit; padding:4px 7px; border:1px solid var(--line); border-radius:4px; background:var(--bg); color:var(--fg); }
  .row button, .row select { font:12px system-ui, sans-serif; padding:3px 7px; border:1px solid var(--line); border-radius:4px;
                             background:var(--bg); color:var(--fg); cursor:pointer; }
  .row label { display:inline-flex; align-items:center; gap:3px; cursor:pointer; user-select:none; }
  #qinfo { color:var(--muted); font-size:11.5px; min-height:15px; }
  #legend { position:absolute; left:10px; bottom:28px; z-index:2; padding:6px 9px; font-size:11.5px; width:330px; max-width:calc(100vw - 20px); }
  #legend .t { font-weight:600; margin-bottom:3px; }
  #legend .bar { height:9px; border-radius:2px; }
  #legend .ticks { position:relative; height:14px; color:var(--muted); font-size:10.5px; font-variant-numeric:tabular-nums; }
  #legend .ticks span { position:absolute; transform:translateX(-50%); white-space:nowrap; }
  #legend .ticks span:first-child { transform:none; }
  #legend .ticks span:last-child { transform:translateX(-100%); }
  #legend .ex { color:var(--muted); margin-top:3px; line-height:1.45; }
  #legend .ex i { display:inline-block; width:18px; height:3px; vertical-align:middle; margin-right:4px; border-radius:2px; }
  #legend .note { color:var(--muted); margin-top:4px; padding-top:4px; border-top:1px solid var(--line); line-height:1.45; }
  #tip { position:absolute; z-index:4; display:none; pointer-events:none; padding:6px 8px; font-size:12px; max-width:280px; line-height:1.45; }
  #panel { position:absolute; right:10px; top:10px; z-index:3; width:320px; max-width:calc(100vw - 20px); max-height:calc(100% - 60px);
           overflow:auto; padding:10px 12px; display:none; font-size:12.5px; line-height:1.5; }
  #panel .x { position:absolute; right:10px; top:8px; cursor:pointer; color:var(--muted); }
  #panel .x:hover { color:var(--fg); }
  .od { font-size:15px; font-weight:700; padding-right:18px; }
  .ln { color:var(--muted); }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:1px 10px; margin-top:4px; font-variant-numeric:tabular-nums; }
  .kv b { font-weight:600; }
  .kv .k { color:var(--muted); }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:3px; }
  .flag { display:inline-block; font-size:10.5px; border:1px solid var(--line); border-radius:3px; padding:0 4px; margin:0 3px 0 0; color:var(--muted); }
  .flag.slow { color:#c62828; border-color:#c62828; } .flag.fast { color:#1f5fbf; border-color:#1f5fbf; }
  table.tau { border-collapse:collapse; margin-top:6px; width:100%; font-variant-numeric:tabular-nums; font-size:12px; }
  table.tau th { text-align:right; font-weight:normal; color:var(--muted); font-size:11px; padding:1px 4px; border-bottom:1px solid var(--line); }
  table.tau td { text-align:right; padding:1px 4px; }
  table.tau th:first-child, table.tau td:first-child { text-align:left; }
  .links { margin-top:8px; display:flex; gap:10px; flex-wrap:wrap; }
  .links a { color:var(--hl); }
  .key { color:var(--muted); font-size:10.5px; margin-top:6px; word-break:break-all; }
  #loading { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:5; padding:8px 14px; color:var(--muted); }
  .maplibregl-ctrl-attrib { font-size:10px; }
  /* 手机：控制框与图例收窄，详情面板改为底部抽屉 */
  @media (max-width: 640px) {
    #ctl { width:calc(100vw - 20px); }
    #legend { width:auto; right:10px; bottom:22px; }
    #legend .note { display:none; }
    #panel { left:10px; right:10px; top:auto; bottom:10px; width:auto; max-height:52%; }
    .maplibregl-ctrl-top-right { top:auto; bottom:120px; }
  }
</style>
</head><body>
<div id="map"></div>
<div id="ctl" class="box">
  <h1>推定限速地图 <button class="fold" id="fold" title="收起 / 展开">收起</button></h1>
  <div class="sub" id="sub">加载中…</div>
  <div class="body">
    <div class="modes" id="srcs" style="margin-bottom:5px">
      <button data-src="simple" class="on" title="第一阶段由时刻表推区间，第二阶段按弯道与坡道在区间内守恒分配（docs/17）">区间 + 弯道分配</button>
      <button data-src="lp" title="物理先验剖面 + 分位数回归 LP 反演（docs/16）">先验 + LP 反演</button>
    </div>
    <div class="modes" id="modes">
      <button data-m="implied" class="on" title="分段限速 / 推定限速">分段限速</button>
      <button data-m="prior" title="区间限速 / 先验限速">区间限速</button>
      <button data-m="mrel" title="段内比值 / 相对系数">段内比值</button>
      <button data-m="n" title="直接观测车次数 n_direct">置信度</button>
    </div>
    <div class="row">
      <input id="q" type="search" list="lnlist" placeholder="线名或站名，如 京沪高铁" autocomplete="off">
      <button id="fit" title="缩放到匹配段">定位</button>
    </div>
    <datalist id="lnlist"></datalist>
    <div id="qinfo"></div>
    <div class="row">
      <label title="indirect：两站间没有直接观测；low_confidence：经过车次 &lt; 3"><input type="checkbox" id="weak" checked> 显示间接 / 低置信段（细线半透明）</label>
    </div>
    <div class="row">
      <span>异常：</span>
      <select id="only">
        <option value="">全部</option>
        <option value="anom">只看偏慢 + 偏快</option>
        <option value="slow">只看偏慢（slow）</option>
        <option value="fast">只看偏快（fast）</option>
      </select>
      <span id="cnt" style="color:var(--muted);font-size:11.5px"></span>
    </div>
  </div>
</div>
<div id="legend" class="box"></div>
<div id="tip" class="box"></div>
<div id="panel" class="box"></div>
<div id="loading" class="box">加载限速数据…</div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const okNum = v => typeof v === 'number' && isFinite(v);

// ---------- 色标：每种模式一组 [值, 颜色] 断点；图例与地图样式都从这里生成 ----------
const KMH_STOPS = [[40, '#67000d'], [60, '#a50f15'], [90, '#e0451f'], [120, '#f28c28'], [160, '#f6bf3a'], [200, '#e9e33b'],
                   [250, '#3cae4b'], [300, '#17becf'], [350, '#1f4fbf']];
const MODES = {
  implied: { field: 'vi', title: '推定限速（km/h）', stops: KMH_STOPS, fmt: v => v },
  prior:   { field: 'vp', title: '先验限速（km/h）', stops: KMH_STOPS, fmt: v => v },
  mrel:    { field: 'mr', title: '相对系数 m_rel（1 = 同档典型；红偏慢，蓝偏快）',
             stops: [[0.5, '#a50026'], [0.7, '#e0513a'], [0.85, '#f9a77a'], [1, '#a9a9a9'], [1.15, '#8cc4e0'], [1.3, '#3f8fd0'], [1.6, '#1f4fbf']],
             fmt: v => v.toFixed(2) },
  n:       { field: 'nd', title: '置信度：直接观测车次数 n_direct',
             stops: [[0, '#b8b8b8'], [1, '#fde725'], [3, '#7ad151'], [10, '#22a884'], [30, '#2a8fb0'], [90, '#6a51c3']],
             fmt: v => v },
};
const colorOf = (mode, v) => {           // 面板色块用：与地图样式同一插值
  const st = MODES[mode].stops;
  if (!okNum(v)) return css('--none');
  if (v <= st[0][0]) return st[0][1];
  for (let i = 1; i < st.length; i++) if (v <= st[i][0]) {
    const [a, ca] = st[i - 1], [b, cb] = st[i], t = (v - a) / (b - a);
    const p = c => [1, 3, 5].map(j => parseInt(c.slice(j, j + 2), 16));
    const A = p(ca), B = p(cb);
    return 'rgb(' + A.map((x, j) => Math.round(x + (B[j] - x) * t)).join(',') + ')';
  }
  return st[st.length - 1][1];
};

// ---------- 状态与 URL hash ----------
// 格式：#src=simple|lp&c=纬度,经度,缩放&m=implied|prior|mrel|n&q=线名&weak=0&only=slow|fast|anom&s=子区间键
// 也认简写 #京沪高速线（等同 q=京沪高速线）。独立页面，不与 map.html 的 hash 共用。
const S = { src: 'simple', mode: 'implied', q: '', weak: true, only: '', sel: null, view: null };
const isSimple = () => (SM ? (SM.method === 'timetable_only' || SM.method === 'lp_merge') : S.src === 'simple');
const modeTitle = m => {
  if (!isSimple()) return MODES[m].title;
  return { implied: '分段限速（km/h，时刻表推区间 + 弯道坡道分配）', prior: '区间限速（km/h，第一阶段纯时刻表推算的整区间均速）',
           mrel: '段内比值（分段限速 ÷ 区间限速；红 = 弯坡降速，蓝 = 直线提速）', n: '置信度：相邻办客站直达车次数 n_direct' }[m];
};
function readHash() {
  let raw = location.hash.slice(1);
  if (!raw) return;
  for (const kv of raw.split('&')) {
    if (!kv) continue;
    const i = kv.indexOf('=');
    let k = i < 0 ? 'q' : kv.slice(0, i), v = i < 0 ? kv : kv.slice(i + 1);
    try { v = decodeURIComponent(v); } catch (e) {}
    if (k === 'c') { const [la, lo, z] = v.split(',').map(Number); if ([la, lo, z].every(okNum)) S.view = { lat: la, lon: lo, z }; }
    else if (k === 'src' && (v === 'simple' || v === 'lp')) S.src = v;
    else if (k === 'm' && MODES[v]) S.mode = v;
    else if (k === 'q' || k === 'line') S.q = v.trim();
    else if (k === 'weak') S.weak = v !== '0';
    else if (k === 'only' && ['slow', 'fast', 'anom'].includes(v)) S.only = v;
    else if (k === 's') S.sel = v;
  }
}
let hashTimer = null;
function writeHash() {
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    if (!map) return;
    const c = map.getCenter(), parts = [];
    if (S.src !== 'simple') parts.push('src=' + S.src);
    parts.push(`c=${c.lat.toFixed(4)},${c.lng.toFixed(4)},${map.getZoom().toFixed(2)}`);
    if (S.mode !== 'implied') parts.push('m=' + S.mode);
    if (S.q) parts.push('q=' + encodeURIComponent(S.q));
    if (!S.weak) parts.push('weak=0');
    if (S.only) parts.push('only=' + S.only);
    if (S.sel != null && SEG[S.sel]) parts.push('s=' + encodeURIComponent(SEG[S.sel].k));
    const h = '#' + parts.join('&');
    if (h !== location.hash) history.replaceState(null, '', h);
  }, 250);
}
readHash();

// ---------- 地图：底图样式照搬 map.html（OpenFreeMap 矢量瓦片 + 地形晕渲，只画陆地 / 水体 / 河流 / 建成区） ----------
// 瓦片地址集中在这一行（与 map.html 同格式；如需换镜像，改这一行即可）
const BASE_TILES = {"omt":"https://tiles.openfreemap.org/planet","dem":"https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png","attr":"<a href=\"https://openfreemap.org\">OpenFreeMap</a> &copy; OpenMapTiles &copy; OpenStreetMap contributors · 地形 <a href=\"https://registry.opendata.aws/terrain-tiles/\">Mapzen Terrain Tiles</a>"};
const baseStyle = () => ({
  version: 8,
  sources: {
    omt: { type: 'vector', ...(BASE_TILES.omt.includes('{z}') ? { tiles: [BASE_TILES.omt], maxzoom: 14 } : { url: BASE_TILES.omt }) },
    dem: { type: 'raster-dem', encoding: 'terrarium', tileSize: 256, maxzoom: 12, tiles: [BASE_TILES.dem] },
  },
  layers: [
    { id: 'land', type: 'background', paint: { 'background-color': css('--bLand') } },
    { id: 'hills', type: 'hillshade', source: 'dem',
      paint: { 'hillshade-exaggeration': +css('--bShadeK'), 'hillshade-shadow-color': css('--bShade'),
               'hillshade-highlight-color': css('--bLit'), 'hillshade-accent-color': css('--bShade'),
               'hillshade-illumination-direction': 315 } },
    { id: 'urban', type: 'fill', source: 'omt', 'source-layer': 'landuse', minzoom: 8,
      filter: ['in', ['get', 'class'], ['literal', ['residential', 'commercial', 'industrial', 'retail']]],
      paint: { 'fill-color': css('--bUrban') } },
    { id: 'water', type: 'fill', source: 'omt', 'source-layer': 'water', paint: { 'fill-color': css('--bWater') } },
    { id: 'river', type: 'line', source: 'omt', 'source-layer': 'waterway', minzoom: 7,
      filter: ['in', ['get', 'class'], ['literal', ['river', 'canal']]],
      layout: { 'line-cap': 'round', 'line-join': 'round' },
      paint: { 'line-color': css('--bRiver'), 'line-width': ['interpolate', ['exponential', 1.4], ['zoom'], 6, 0.5, 10, 1.2, 14, 3] } },
  ],
});
const map = new maplibregl.Map({
  container: 'map', style: baseStyle(),
  center: S.view ? [S.view.lon, S.view.lat] : [113, 33.5], zoom: S.view ? S.view.z : 4.3,
  minZoom: 2, maxZoom: 16, dragRotate: false, pitchWithRotate: false, touchPitch: false,
  // OpenFreeMap 的版权由 TileJSON 自带，这里只补地形与数据说明
  attributionControl: { customAttribution: '地形 <a href="https://registry.opendata.aws/terrain-tiles/">Mapzen Terrain Tiles</a> · 时刻 12306 · 推定限速为反演结果，非官方信息' },
});
map.touchZoomRotate.disableRotation();
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ maxWidth: 110, unit: 'metric' }), 'bottom-right');

// ---------- 路网底图（map_rails_lo.json / map_rails.json，enc "d4" 解码同 map.html；未打包时是纯数组旧格式） ----------
const RAILS_LO_MAXZ = 6;
let RAILS = { lo: null, hi: null }, railsHiLoading = false, DATES = null;
function parseRails(rj) {
  const lines = Array.isArray(rj) ? rj : rj.lines, d4 = !Array.isArray(rj) && rj.enc === 'd4';
  let x = 0, y = 0;
  const feats = [];
  for (const [cls, f] of lines) {
    const co = [];
    if (d4) { for (let j = 0; j < f.length; j += 2) { x += f[j]; y += f[j + 1]; co.push([x / 1e4, y / 1e4]); } }
    else for (let j = 0; j < f.length; j += 2) co.push([f[j], f[j + 1]]);
    if (co.length >= 2) feats.push({ type: 'Feature', properties: { c: cls }, geometry: { type: 'LineString', coordinates: co } });
  }
  return { gj: { type: 'FeatureCollection', features: feats }, lo: !Array.isArray(rj) && rj.lod === 'lo' };
}
const getJSON = u => fetch(u).then(r => { if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); });
function loadRails() {
  return getJSON('map_dates.json').catch(() => null).then(d => {
    DATES = d;
    return getJSON((d && (d.rails_lo || d.rails)) || 'map_rails.json');
  }).then(rj => {
    const { gj, lo } = parseRails(rj);
    if (lo) RAILS.lo = gj; else RAILS.hi = gj;
    setRailsData();
  }).catch(e => console.warn('路网底图加载失败', e));
}
function maybeLoadRailsHi() {
  if (RAILS.hi || railsHiLoading || map.getZoom() <= RAILS_LO_MAXZ || !(DATES && DATES.rails)) return;
  railsHiLoading = true;
  getJSON(DATES.rails).then(rj => { RAILS.hi = parseRails(rj).gj; setRailsData(); })
    .catch(() => { railsHiLoading = false; });
}
function setRailsData() {
  const src = map.getSource && map.getSource('rails');
  if (!src) return;
  const gj = (map.getZoom() > RAILS_LO_MAXZ && RAILS.hi) || RAILS.lo || RAILS.hi;
  if (gj && src._railsRef !== gj) { src.setData(gj); src._railsRef = gj; }
}

// ---------- 限速数据 ----------
let SM = null, SEG = [], SEGGJ = null, BYKEY = new Map(), hoverId = null, matched = null;
const pct = (n, d) => d ? (100 * n / d).toFixed(1) + '%' : '-';
function buildSegments(sm) {
  const feats = [], parents = sm.parents || null;
  SEG = (sm.segments || []).map(raw => (parents && raw.pk && parents[raw.pk]) ? Object.assign({}, parents[raw.pk], raw) : raw);
  SEG.forEach((s, i) => {
    BYKEY.set(s.k, i);
    if (s.pk && !BYKEY.has(s.pk)) BYKEY.set(s.pk, i);
    const fl = s.flags || [];
    const co = Array.isArray(s.coords) ? s.coords.filter(p => p && okNum(p[0]) && okNum(p[1])) : [];
    if (co.length < 2) return;
    feats.push({ type: 'Feature', id: i, geometry: { type: 'LineString', coordinates: co },
      properties: { i, line: s.line || '', a: s.a || '', b: s.b || '',
        vi: okNum(s.kmh_implied) ? s.kmh_implied : null, vp: okNum(s.kmh_prior) ? s.kmh_prior : null,
        mr: okNum(s.m_rel) ? s.m_rel : null, nd: okNum(s.n_direct) ? s.n_direct : 0,
        weak: fl.includes('indirect') || fl.includes('low_confidence') ? 1 : 0,
        slow: fl.includes('slow') ? 1 : 0, fast: fl.includes('fast') ? 1 : 0 } });
  });
  SEGGJ = { type: 'FeatureCollection', features: feats };
  // 线名候选（按段数降序）
  const cnt = new Map();
  for (const s of SEG) if (s.line) cnt.set(s.line, (cnt.get(s.line) || 0) + 1);
  $('lnlist').innerHTML = [...cnt.entries()].sort((a, b) => b[1] - a[1]).map(([n]) => `<option value="${esc(n)}">`).join('');
  // 统计（控制台，方便排查数据）
  const n = SEG.length, nul = f => SEG.filter(s => !okNum(s[f])).length;
  console.info('[speed] 段数', n, '可画', feats.length, 'kmh_implied 空', pct(nul('kmh_implied'), n), 'kmh_prior 空', pct(nul('kmh_prior'), n),
               'm_rel 空', pct(nul('m_rel'), n));
}
function fmtDate(s) { return String(s || '').replace('T', ' ').replace(/\.\d+.*$/, '').replace(/(\d\d:\d\d):\d\d.*$/, '$1'); }
function setSub() {
  const ds = (SM.dates || []).slice().sort();
  const range = ds.length ? (ds.length > 1 ? `${ds[0]} ~ ${ds[ds.length - 1]}（${ds.length} 天）` : ds[0]) : '日期未知';

// ---------- 样式表达式 ----------
const field = () => MODES[S.mode].field;

  for (const [v, c] of st) interp.push(v, c);

  return ['case', ['==', ['typeof', ['get', f]], 'number'], interp, css('--none')];
}
// 线宽：缩放插值必须在表达式最外层，数据驱动的倍数放进各断点的输出里
const W_STOPS = [[4, 1.1], [7, 2], [10, 3.2], [13, 5.5], [16, 8]];
const zoomW = (k, add = 0) => ['interpolate', ['exponential', 1.5], ['zoom'], ...W_STOPS.flatMap(([z, w]) => [z, typeof k === 'number' ? w * k + add : ['+', ['*', w, k], add]])];
// 上下行是两条同几何反向的记录：按左行习惯往行进方向左侧偏移，放大后能看到两股
const OFF = ['interpolate', ['exponential', 1.5], ['zoom'], 7, 0, 9, -1.2, 12, -2.6, 16, -4.5];
const hitList = () => matched ? ['literal', [...matched]] : null;

  const hl = hitList();

}

}

}

// ---------- 图例 ----------

// ---------- 搜索 ----------
function runSearch(fit) {

  const m = new Set(), lines = new Set();
  const exact = SEG.some(s => s.line === q);
  SEG.forEach((s, i) => {
    const hit = exact ? s.line === q : (s.line || '').includes(q) || s.a === q || s.b === q;
    if (hit) { m.add(i); lines.add(s.line); }

  matched = m;
  $('qinfo').textContent = m.size ? `匹配 ${m.size} 段` + (lines.size <= 3 ? '：' + [...lines].join('、') : `，${lines.size} 条线`) : '没有匹配的段';

  if (w > e) return;
  const narrow = innerWidth <= 640;

}

// ---------- 悬停提示与详情面板 ----------
const f1 = v => okNum(v) ? (Math.round(v * 100) / 100).toString() : '–';

    keys.map(k => `<tr><td>${esc(k)}</td><td>${f1(t[k])}${pace(t[k])}</td><td>${f1(tp[k])}${pace(tp[k])}</td></tr>`).join('') +
    `</table><div style="color:var(--muted);font-size:10.5px">灰字为折合平均速度 km/h（通–通，不含起停）</div>`;

    return `<span class="k">区间来源</span><span>OSM 标注限速（各档车均跑满，时刻表只能给出 ≥ ${esc(b.lb)} km/h；OSM 标注覆盖 ${Math.round((b.osm_share || 0) * 100)}%，最高 ${esc(b.osm_max)}）<span style="color:var(--muted)">${orig}</span></span>`;

    return `<span class="k">区间来源</span><span>LP 联合反演（扣编图富余${lb ? '，各档均跑满，仅为下界' : ''}）<span style="color:var(--muted)">${orig}</span></span>`;

function infoHtml(s, full) {

function setHover(id) {

    map.setFeatureState({ source: 'seg', id: S.sel }, { sel: false });

}));
mapReady.then(() => { addOverlay(); bindEvents(); });
// 深浅主题切换：重建底图样式后再把叠加层加回去
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  map.setStyle(baseStyle(), { diff: false });
  map.once('style.load', () => { addOverlay(); drawLegend(); });
});
Promise.all([dataReady, mapReady]).then(([sm]) => {
  SM = sm;
  buildSegments(sm);
  syncControls();
  setSub();
  addOverlay();
  const selKey = S.sel;
  S.sel = null;
  runSearch(S.view ? false : 'instant');
  if (selKey != null && BYKEY.has(selKey)) select(BYKEY.get(selKey), !S.view && !S.q ? 'instant' : false);
  $('loading').remove();
  window.__speedReady = true;
}).catch(e => {
  console.error(e);
  $('loading').textContent = '限速数据加载失败：' + (e && e.message || e);
  $('sub').textContent = '没有找到限速数据（需先运行 railmap.timetable.speed_limit）';
});
</script>
</body></html>
