<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>列车位置地图</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/leaflet.min.css">
<script src="vendor/leaflet.min.js"></script>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/leaflet-maplibre-gl.js"></script>
<style>
  :root { --bg:#fff; --fg:#222; --muted:#777; --line:#ddd; --sel:#e6007e; --hl:#0891b2;
          --r0:#b0272f; --r1:#e8892b; --r2:#3a78b5; --r3:#9aa0a6;
          --tS:#a7aeb6; --tW:#ffffff; --tJ:#2e9a63; --tZT:#8a9a52; --tK:#3f9142; --tO:#1d5a3a;
          --tGold:#d4a017; --tEdge:#4a4a4a;
          --bLand:#f3f2ee; --bWater:#c6d9e6; --bRiver:#a9c6dc; --bUrban:#e4e1da;
          --bShade:#5f5a50; --bLit:#ffffff; --bShadeK:0.35;
          --stFill:#d4d4d4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1b1b1b; --fg:#e6e6e6; --muted:#9a9a9a; --line:#3a3a3a; --sel:#ff4fc0; --hl:#22d3ee;
          --r0:#e5484d; --r1:#f0a04b; --r2:#5b9bd5; --r3:#6b7075;
          --tS:#959ca4; --tW:#d6d1c4; --tJ:#3fb57a; --tZT:#a3b36a; --tK:#58b05b; --tO:#2f7d52;
          --tGold:#f0c040; --tEdge:#1b1b1b;
          --bLand:#1f1f1f; --bWater:#14202a; --bRiver:#1c3142; --bUrban:#292927;
          --bShade:#000000; --bLit:#3a3a3a; --bShadeK:0.45;
          --stFill:#4a4a4a; } }
  #legend { position:absolute; left:10px; bottom:66px; z-index:1000; background:var(--bg); border:1px solid var(--line);
            border-radius:6px; padding:6px 9px; font-size:12px; line-height:1.7; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  #legend i { display:inline-block; width:18px; height:3px; vertical-align:middle; margin-right:6px; border-radius:2px; }
  #auxtip { position:absolute; z-index:1001; display:none; background:var(--bg); color:var(--fg); border:1px solid var(--line);
            border-radius:5px; padding:4px 8px; font-size:12px; box-shadow:0 1px 4px rgba(0,0,0,.2); pointer-events:none; }
  #legend svg { vertical-align:middle; margin:0 6px 0 0; }
  #legend .h { color:var(--muted); font-size:11px; margin-top:4px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #legend .h:first-child { margin-top:0; }
  #mkbtn { font:11px system-ui, sans-serif; line-height:1.3; padding:1px 6px; border:1px solid var(--line); border-radius:4px;
           background:none; color:var(--muted); cursor:pointer; }
  #mkbtn:hover { color:var(--fg); border-color:var(--muted); }
  .kd { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; vertical-align:baseline;
        box-sizing:border-box; border:1px solid var(--tEdge); }
  html, body { margin:0; height:100%; font:13px system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  #map { position:absolute; inset:0 0 56px 0; }
  #bar { position:absolute; left:0; right:0; bottom:0; height:56px; display:flex; align-items:center; gap:12px; padding:0 14px;
         background:var(--bg); border-top:1px solid var(--line); box-sizing:border-box; }
  #clock { font:600 20px ui-monospace, monospace; min-width:70px; }
  #slider { flex:1; }
  .seg { display:inline-flex; }
  .seg button { min-width:28px; height:28px; padding:0 !important; border-radius:0 !important; margin-left:-1px; }
  .seg button:first-child { border-radius:4px 0 0 4px !important; margin-left:0; }
  .seg button:last-child { border-radius:0 4px 4px 0 !important; }
  .seg button.pre { border-color:var(--sel) !important; color:var(--sel) !important; position:relative; }
  .seg button.on { background:var(--sel) !important; border-color:var(--sel) !important; color:#fff !important; position:relative; }
  #slider.run { accent-color:var(--sel); }
  #bar button, #bar select, #bar input[type=text] { font:inherit; padding:4px 8px; }
  #count { color:var(--muted); min-width:110px; }
  /* 分屏：下半屏嵌运行图（diagram.html），上沿可拖动调高度 */
  #dgwrap { position:absolute; left:0; right:0; bottom:56px; height:var(--dgH, 45%); display:none; border-top:1px solid var(--line);
            background:var(--bg); z-index:1001; }
  #dgwrap iframe { width:100%; height:100%; border:0; display:block; }
  #dgsplit { position:absolute; left:0; right:0; top:-5px; height:10px; cursor:ns-resize; z-index:2; }
  #dghint { position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); color:var(--muted); pointer-events:none; }
  body.split #dgwrap { display:block; }
  body.split #map { bottom:calc(56px + var(--dgH, 45%)); }
  body.split #legend { display:none; }
  body.split #panel { max-height:calc(100% - 56px - var(--dgH, 45%) - 30px); }
  body.dgdrag iframe { pointer-events:none; }
  #dgbtn { display:inline-flex; align-items:center; gap:4px; cursor:pointer; }
  #dgbtn .chev { width:11px; height:11px; transition:transform .16s ease; }
  #dgbtn.on, #mkbtn.on { color:var(--sel); border-color:var(--sel); background:color-mix(in srgb, var(--sel) 12%, transparent); font-weight:500; }
  #dgbtn.on .chev { transform:rotate(180deg); }
  #panel { position:absolute; top:10px; right:10px; width:312px; max-height:calc(100% - 90px); overflow:hidden; z-index:1000;
           background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:10px 12px; display:none;
           flex-direction:column; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  #panel > * { flex-shrink:0; }            /* 只让表格收缩，标题、线路、底栏等不被压扁裁掉 */
  #panel > .x { position:absolute; top:10px; right:12px; cursor:pointer; color:var(--muted); font-size:13px; line-height:1; }
  #panel > .x:hover { color:var(--fg); }
  #panel h3 { margin:0 0 4px; font-size:17px; font-weight:700; padding-right:18px; display:flex; align-items:baseline; gap:5px; flex-wrap:wrap; line-height:1.25; }
  #panel h3 .note, #panel h3 .tag, #panel h3 .kb-lim { font-weight:normal; }
  #panel h3 .tag { font-size:11px; padding:1px 4px; margin-left:0; }
  #panel .od-row { display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:4px; }
  #panel .od { font-size:14px; font-weight:600; }
  #panel .od .note { font-weight:normal; margin-left:4px; }
  #panel .cam { display:inline-flex; align-items:center; justify-content:center; width:26px; height:22px;
                border:1px solid var(--line); border-radius:5px; cursor:pointer; color:var(--muted); text-decoration:none; flex:none; }
  #panel .cam:hover { color:var(--fg); border-color:var(--muted); }
  #panel .cam.on { background:var(--tJ); border-color:var(--tJ); color:#fff; }
  #panel .runs { display:flex; border-bottom:1px solid var(--line); margin:4px 0 6px; gap:2px; }
  #panel .runs .tab { flex:1; text-align:center; padding:3px 4px 4px; cursor:pointer; border-bottom:2px solid transparent;
                      margin-bottom:-1px; color:var(--muted); text-decoration:none; border-radius:4px 4px 0 0; line-height:1.25; }
  #panel .runs .tab:hover { color:var(--fg); background:color-mix(in srgb, var(--fg) 4%, transparent); }
  #panel .runs .tab.cur { color:var(--sel); border-bottom-color:var(--sel); background:color-mix(in srgb, var(--sel) 6%, transparent); }
  #panel .runs .tab .t-d { display:block; font-size:11px; font-weight:600; font-variant-numeric:tabular-nums; }
  #panel .runs .tab .t-s { display:block; font-size:10px; opacity:.85; }
  #panel .stat { background:color-mix(in srgb, var(--fg) 4%, transparent); border:1px solid var(--line); border-radius:4px;
                 padding:5px 8px; margin:4px 0 2px; font-size:12px; line-height:1.45; }
  #panel .tw { flex:1 1 auto !important; min-height:80px; overflow:auto; margin-top:6px; border-top:1px solid var(--line); }
  #panel .tw table { margin-top:0; }
  #panel .tw th { position:sticky; top:0; z-index:1; background:var(--bg); text-align:left; font-weight:normal; color:var(--muted);
                  font-size:11px; padding:3px 4px; box-shadow:0 1px 0 var(--line); white-space:nowrap; }
  #panel .tw th.num, #panel .tw td.num, #panel .kb-sub th.num, #panel .kb-sub td.num { text-align:right; font-variant-numeric:tabular-nums; }
  #panel table { width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; }
  #panel td { padding:3px 4px; border-top:1px solid var(--line); white-space:nowrap; }
  #panel td.main, #panel .kb-sub td:first-child { width:100%; max-width:0; overflow:hidden; text-overflow:ellipsis; }
  #panel tr.past td { color:var(--muted); }
  #panel tr.cur td { font-weight:600; background:color-mix(in srgb, var(--sel) 10%, transparent); }
  #panel tr.next td { font-weight:600; }
  #panel tr.next td:first-child::before { content:"→ "; color:var(--sel); font-weight:700; }
  #panel a[data-line], #panel a[data-st], #panel a[data-pan], #panel a.back, #panel tr[data-i] a { color:inherit; text-decoration:underline dotted; cursor:pointer; }
  #panel a[data-line]:hover, #panel a[data-st]:hover, #panel a[data-pan]:hover, #panel a.back:hover, #panel tr[data-i] a:hover { color:var(--sel); }
  #panel .tm { cursor:pointer; }
  #panel .tm:hover { text-decoration:underline; color:var(--sel); }
  #panel .tag { white-space:nowrap; font-size:10px; color:var(--muted); border:1px solid var(--line); border-radius:3px; padding:0 3px; margin-left:3px; font-variant-numeric:tabular-nums; }
  #panel .warn { color:#d9822b; }
  #panel .sg { white-space:nowrap; font-size:10px; line-height:1.2; color:var(--hl); border:1px solid var(--hl); border-radius:3px; padding:0 2px; margin-left:3px; cursor:help; }
  #panel .foot { margin-top:6px; padding-top:4px; border-top:1px solid var(--line); color:var(--muted); font-size:11px;
                 display:flex; justify-content:space-between; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .more { text-decoration:underline dotted; cursor:help; flex:none; }
  sup.day { font-size:9px; line-height:0; vertical-align:super; margin-left:.5px; font-weight:normal; }
  svg.ext { width:11px; height:11px; vertical-align:-1px; margin-left:1px; opacity:.75; }
  .emu-row { display:flex; align-items:center; gap:5px; margin:1px 0 3px; line-height:1.2; }
  .emu-ico { display:inline-flex; align-items:center; line-height:0; text-decoration:none !important; flex:none; }
  .emu-ico svg { display:block; }
  /* 火车Wiki 客里表符号与接算站标记 */
  u.jsz, #panel a.jsz { color:color-mix(in srgb, var(--fg) 55%, #a82028); text-decoration:underline !important;
                        text-decoration-color:color-mix(in srgb, currentColor 65%, transparent) !important; text-underline-offset:2px; }
  #panel a.jsz:hover { color:var(--sel); }
  .kb-lim { font-family:"Songti SC", "SimSun", system-ui, sans-serif; letter-spacing:.5px; font-size:12px; }
  .kb-lim span { cursor:help; }
  .kb-Post { margin-left:1px; font-weight:600; cursor:help; }
  #panel .kb-bar { display:flex; align-items:center; justify-content:space-between; gap:6px; width:100%; box-sizing:border-box;
                   margin:4px 0 0; padding:3px 7px; font:11.5px system-ui, sans-serif; color:var(--fg); cursor:pointer;
                   background:color-mix(in srgb, var(--fg) 3%, transparent); border:1px solid var(--line); border-radius:4px; text-decoration:none; }
  #panel .kb-bar:hover { border-color:color-mix(in srgb, var(--sel) 50%, var(--line)); }
  #panel .kb-bar.open { border-radius:4px 4px 0 0; background:color-mix(in srgb, var(--sel) 9%, transparent);
                        border-color:color-mix(in srgb, var(--sel) 40%, var(--line)); }
  #panel .kb-bar .kb-l { display:flex; align-items:center; gap:5px; min-width:0; overflow:hidden; }
  #panel .kb-bar .chev { width:11px; height:11px; flex:none; transition:transform .16s ease; }
  #panel .kb-bar.open .chev { transform:rotate(90deg); }
  #panel .kb-bar .kb-sum { color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #panel .kb-bar .kb-cnt { color:var(--muted); font-variant-numeric:tabular-nums; flex:none; }
  #panel .kb-sub { width:100%; border-collapse:collapse; font-size:11.5px; margin:0 0 4px; border:1px solid var(--line);
                   border-top:0; border-radius:0 0 4px 4px; overflow:hidden; }
  #panel .kb-sub th { background:color-mix(in srgb, var(--fg) 4%, transparent); color:var(--muted); font-weight:normal;
                      font-size:11px; text-align:left; padding:2px 6px; border-bottom:1px solid var(--line); }
  #panel .kb-sub td { padding:2px 6px; border-top:1px solid var(--line); white-space:nowrap; }
  /* 选中历史：取消选中后右上角显示刚才的对象，点击恢复；▾ 展开最近的历史 */
  #hist { position:absolute; top:10px; right:10px; z-index:1000; display:none; font-size:12px; }
  #hist .grp { display:flex; background:var(--bg); border:1px solid var(--line); border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  #hist button { font:inherit; color:inherit; background:none; border:0; padding:5px 9px; cursor:pointer; white-space:nowrap; }
  #hist button:hover { color:var(--sel); }
  #histBtn { max-width:240px; overflow:hidden; text-overflow:ellipsis; }
  #histDd { border-left:1px solid var(--line) !important; padding:5px 7px !important; }
  #histList { position:absolute; right:0; top:calc(100% + 4px); min-width:220px; max-width:320px; max-height:60vh; overflow:auto;
              background:var(--bg); border:1px solid var(--line); border-radius:6px; box-shadow:0 2px 8px rgba(0,0,0,.15);
              margin:0; padding:4px 0; list-style:none; display:none; }
  #hist.open #histList { display:block; }
  #histList li { padding:4px 10px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #histList li:hover { background:color-mix(in srgb, var(--sel) 12%, transparent); }
  #histList .k { display:inline-block; min-width:2.6em; color:var(--muted); font-size:11px; }
  #histList .clr { color:var(--muted); font-size:11px; border-top:1px solid var(--line); margin-top:3px; padding-top:5px; }
  #tip { position:absolute; z-index:1001; pointer-events:none; background:var(--bg); border:1px solid var(--line);
         border-radius:4px; padding:3px 7px; display:none; white-space:nowrap; box-shadow:0 1px 4px rgba(0,0,0,.15); font-size:11px; line-height:1.3; }
  #tip b { font-size:11.5px; font-weight:600; }
  #tip .kd { width:7px; height:7px; margin-right:4px; }
  .note { color:var(--muted); font-size:11px; }
  #panel tr.wait td { font-style:italic; color:var(--muted); font-size:11.5px; }
  #panel tr.wait td:first-child { padding-left:8px; }
  #panel tr.wait.cur td { color:var(--fg); font-weight:600; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:2000; background:var(--bg); }
  /* 路网先画出来以后，遮罩缩成顶部的小提示，等列车数据 */
  #loading.mini { inset:auto; top:10px; left:50%; transform:translateX(-50%); padding:4px 12px; border-radius:12px;
                  font-size:12px; color:var(--muted); background:var(--bg); opacity:.9; pointer-events:none; }
  /* 底图淡化：灰度 + 半透明；深色模式反色成暗底 */
  .leaflet-container { background:var(--bg); }
  .leaflet-control-scale-line { background:color-mix(in srgb, var(--bg) 75%, transparent); color:var(--fg);
                                border-color:var(--fg); font-size:11px;
                                text-shadow:none; }   /* Leaflet 默认白色阴影在深色主题下成了重影 */
  #bar label { color:var(--muted); display:flex; align-items:center; gap:4px; }
  /* 日期选择 */
  #datebox { display:flex; align-items:center; gap:4px; flex:none; }
  #datebox button { padding:4px 6px; }
  #datebox button:disabled { opacity:.35; }
  #date option:disabled { color:var(--muted); }
  #dinfo { color:var(--muted); font-size:11px; line-height:1.25; max-width:170px; overflow:hidden; display:-webkit-box;
           -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  #dinfo .warn { color:#d9822b; }
  #dloading { color:var(--muted); font-size:11px; display:none; }
  /* 窄屏：顶栏收紧，次要控件隐藏，仍放不下时可横向滚动（不撑破页面） */
  @media (max-width: 900px) {
    #bar { gap:6px; padding:0 8px; overflow-x:auto; overflow-y:hidden; }
    #bar > * { flex:none; }
    #slider { flex:1 0 120px; }
    #zoom, #bar label, #count { display:none; }
    #dinfo { max-width:110px; }
    #clock { font-size:16px; min-width:52px; }
  }
  @media (max-width: 560px) {
    #bar { gap:4px; padding:0 6px; }
    #dinfo, #speed [data-v="60"], #speed [data-v="1200"] { display:none; }
    #q { width:4.5em; }
    #date { max-width:7.5em; }
    #slider { flex:1 0 80px; min-width:80px; }
    #clock { font-size:14px; min-width:44px; }
    #bar button, #bar select, #bar input[type=text] { padding:3px 4px; }
  }
</style></head><body>
<div id="map"></div>
<div id="bar">
  <span id="datebox" style="display:none">
    <button id="dprev" title="前一个有数据的日期">‹</button>
    <select id="date" title="日期"></select>
    <button id="dnext" title="后一个有数据的日期">›</button>
    <span id="dloading">加载中…</span>
    <span id="dinfo"></span>
  </span>
  <span id="speed" class="seg" title="点速度开始播放，再点一下正在用的速度或点 ❚❚ 暂停；空格键播放/暂停"><button data-v="0" class="on" title="暂停">❚❚</button><button data-v="60" class="pre" title="60×：1 秒走 1 分钟">›</button><button data-v="300" title="300×：1 秒走 5 分钟">»</button><button data-v="1200" title="1200×：1 秒走 20 分钟">⋙</button></span>
  <span id="clock">--:--</span>
  <input id="slider" type="range" min="0" max="1440" step="0.5" value="480">
  <input id="q" type="text" placeholder="车次/站名，如 G1" size="11">
  <button id="dgbtn" title="下半屏显示运行图：选中客里表线路时显示该线，选中车次时显示它当前所在的线路"><span>运行图</span><svg class="chev" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 7.5L6 4L9.5 7.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <label>底图 <input id="baseop" type="range" min="0" max="1" step="0.05" style="width:80px"></label>
  <span id="count"></span>
  <span id="zoom" style="color:var(--muted)"></span>
</div>
<div id="panel"></div><div id="tip"></div><div id="auxtip"></div>
<div id="hist"><div class="grp"><button id="histBtn" title="恢复选中"></button><button id="histDd" title="最近选中过的">▾</button></div><ul id="histList"></ul></div>
<div id="dgwrap"><div id="dgsplit" title="拖动调整高度"></div><div id="dghint">选中一条线路或一趟车，这里显示对应线路的运行图</div><iframe id="dg" title="运行图"></iframe></div>
<div id="legend">
  <div class="h"><span>动车组</span><button id="mkbtn" type="button" title="切换列车地图标记：默认经典五边形 / 车型涂装极简色块">涂装</button></div>
  <div data-lv="W" data-fx="1" hidden>复兴号</div>
  <div data-lv="S">300+ 高铁</div>
  <div data-lv="W">200-250</div>
  <div data-lv="J">动集</div>
  <div class="h">普速</div>
  <div data-lv="ZT">Z/T 直达·特快</div>
  <div data-lv="K">K 快速</div>
  <div data-lv="O">普快·其他</div>
  <div class="h">线路</div>
  <div><i style="background:var(--r0)"></i>高铁 300–350</div>
  <div><i style="background:var(--r1)"></i>高铁/城际 200–250</div>
  <div><i style="background:var(--r2)"></i>普速干线 120–160</div>
  <div><i style="background:var(--r3)"></i>其他普速</div>
  <div><i style="background:var(--muted);height:1.5px"></i>细线 = 单线</div>
  <div><svg width="18" height="10"><path d="M3 9L15 1" stroke="var(--muted)" stroke-width="1.6"/></svg>会让站 / 线路所</div>
</div>
<div id="loading">加载数据…</div>
<script src="emu_icons.js?v=4"></script>
<script>
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  const u = (km - k[lo]) / (k[hi] - k[lo] || 1);

// 车次标签避让：选中/悬停的先放；默认位置与已放标签（含车站名）重叠时上下交替挪一行，
// 挪开的标签用细线连回车身；普通标签挪 MAX_TRY 次仍无空位就不画，选中的总会画。
// 帧间记忆防抖：
// 1. 左右朝向防抖（SIDE_HYST）：近南北/浅弯处 lab.x ≈ a.p.x 时锁定上一帧左右侧，避免标签整宽横跳；
// 2. 排序防抢位：同优先级下「上帧已显示 > 偏移量 |dy| 小 > 在屏时间久（born 早）」先放，保证原位(dy=0)车次先占座，
//    不会因数组顺序靠后被移位车次误判原位空闲而周期性互换位置；
// 3. 空间迟滞 + 时间防抖：保持旧槽位用宽松边距（KEEP_PAD），选新槽位用标准边距（NEW_PAD），回原位用严格边距（RET_PAD）
//    且须在当前槽位呆满 HOLD_MS、原位连续空出 RETURN_MS 才回位；被迫换位时优先选同侧就近槽位；
// 4. 显隐防闪烁 + 平滑过渡：短暂被挤掉的标签在 GRACE_MS 内保留记忆，恢复显示需连续空出 SHOW_MS；
//    槽位或朝向变化时对相对车身的偏移做指数阻尼平滑（TAU_MS），消除单帧跳变。
let labMem = new Map(), labMemZoom = null, labAnimRaf = 0;
const trMemKey = tr => tr.c + (tr.od ? '@' + tr.od : '');
function drawTrainLabels(ctx, labels) {
  const z = map.getZoom(), now = performance.now();
  const RETURN_MS = 750, HOLD_MS = 450, SHOW_MS = 180, GRACE_MS = 1500, TAU_MS = 80;
  const SIDE_HYST = 3, KEEP_PAD = -1, NEW_PAD = 0.5, RET_PAD = 2;
  if (z !== labMemZoom) { labMem.clear(); labMemZoom = z; }
  for (const [k, v] of labMem) if (now - v.lastSeen > GRACE_MS) labMem.delete(k);
  if (!labels.length) return;
  const tfs = z <= 10 ? 10 : 11, H = tfs + 2, MAX_TRY = 8, placed = stLabelBoxes.slice();
  const hit = b => placed.some(q => b[0] < q[2] && b[2] > q[0] && b[1] < q[3] && b[3] > q[1]);
  ctx.font = tfs + 'px system-ui'; ctx.textBaseline = 'middle';
  const bg = css('--bg'), fg = css('--fg'), mu = css('--muted');
  const baseCand = [];
  for (let k = 0; k <= MAX_TRY; k++) baseCand.push((k % 2 ? 1 : -1) * Math.ceil(k / 2) * H);   // 0, +H, −H, +2H, −2H …
  for (const it of labels) it.m = labMem.get(it.key = trMemKey(it.a.tr));
  labels.sort((x, y) => x.pri - y.pri
    || ((y.m && y.m.vis ? 1 : 0) - (x.m && x.m.vis ? 1 : 0))
    || ((x.m ? Math.abs(x.m.dy) : 1e9) - (y.m ? Math.abs(y.m.dy) : 1e9))
    || ((x.m ? x.m.born : Infinity) - (y.m ? y.m.born : Infinity)));
  let gliding = false;
  for (const { a, lab, isSel, key, m: old } of labels) {
    const txt = a.tr.c.split('/')[0], w = ctx.measureText(txt).width;
    const sideDx = lab.x - a.p.x;
    const left = old && old.left !== undefined ? (old.left ? sideDx >= -SIDE_HYST : sideDx > SIDE_HYST) : sideDx >= 0;
    const box = (dy, pad = 0) => {
      const x0 = left ? lab.x : lab.x - w, y = lab.y + dy;
      return [x0 - 1 - pad, y - H / 2 - pad, x0 + w + 1 + pad, y + H / 2 + pad];
    };
    let dy, freeSince = null, slotSince = old ? old.slotSince : now;

      dy = old.dy;
      if (dy !== 0 && now - slotSince >= HOLD_MS && !hit(box(0, RET_PAD))) {
        freeSince = old.freeSince ?? now;
        if (now - freeSince >= RETURN_MS) { dy = 0; freeSince = null; slotSince = now; }
      }
    } else {
      const cand = old ? baseCand.slice().sort((d1, d2) =>
        (Math.abs(d1) + 1.15 * Math.abs(d1 - old.dy)) - (Math.abs(d2) + 1.15 * Math.abs(d2 - old.dy))) : baseCand;
      dy = cand.find(d => !hit(box(d, NEW_PAD)));
      if (dy !== undefined && (!old || dy !== old.dy)) slotSince = now;
    }
    if (dy === undefined) {
      if (!isSel) {
        if (old) { old.vis = false; old.showSince = null; old.freeSince = null; old.lastSeen = now; }
        continue;
      }
      dy = old ? old.dy : 0;
    }
    if (!isSel && old && !old.vis) {                        // 刚被挤掉的普通标签需连续空出 SHOW_MS 才重新显示
      const showSince = old.showSince ?? now;

        continue;
      }
    }
    const targetOx = lab.x - a.p.x, targetOy = lab.y - a.p.y + dy;
    const dt = old && old.vis && old.lastSeen != null ? Math.max(0, now - old.lastSeen) : 999;
    const alpha = (old && old.vis && old.ox !== undefined && dt <= 250) ? (1 - Math.exp(-Math.max(1, dt) / TAU_MS)) : 1;
    let ox = alpha < 1 ? old.ox + (targetOx - old.ox) * alpha : targetOx;
    let oy = alpha < 1 ? old.oy + (targetOy - old.oy) * alpha : targetOy;

    placed.push([Math.min(bTarget[0], bRender[0]), Math.min(bTarget[1], bRender[1]),
                 Math.max(bTarget[2], bRender[2]), Math.max(bTarget[3], bRender[3])]);
    labMem.set(key, {
      dy, left, ox, oy, vis: true,
      born: old ? old.born : now,
      slotSince, freeSince, showSince: null, lastSeen: now,

      ctx.beginPath(); ctx.moveTo(lab.x + (left ? -3 : 3), lab.y); ctx.lineTo(rx, ry);
      ctx.lineWidth = 0.8; ctx.strokeStyle = mu; ctx.stroke();
    }

    ctx.lineWidth = 3; ctx.strokeStyle = bg; ctx.strokeText(txt, rx, ry);
    ctx.fillStyle = fg; ctx.fillText(txt, rx, ry);
  }

    labAnimRaf = requestAnimationFrame(() => { labAnimRaf = 0; draw(); });
  }
}

  try {
    const r = await fetch('map_dates.json', { cache: 'no-cache' });
    if (r.ok) { const m = await r.json(); if (m && Array.isArray(m.dates) && m.dates.some(x => x.selectable && x.file)) DATES = m; }
  } catch (e) {}
  // 先只拉粗糙路网（约 0.2 MB），到了（或失败）再拉列车数据，不和它抢带宽
  await Promise.race([startRailsFetch().catch(() => {}), new Promise(r => setTimeout(r, 4000))]);
  if (DATES && DATES.geo) preloadGeo(DATES.geo);
  if (!DATES) {                      // 回退：单文件
    const data = await expandGeo(await (await fetch('map_data.json')).json());
    curDate = null; initData(data); return;
  }
  // 起始日期：锚点 > 本机记忆 > 清单默认 > 最后一个可选日期
  const ok = d => d && dateEntry(d) && dateEntry(d).selectable && dateEntry(d).file;
  const ss = selectable();
  const start = [parseHash().date, saved && saved.date, DATES.default].find(ok) || ss[ss.length - 1].date;
  renderDateBox();
  // 初始时刻（同 firstSetup + readHash）；锚点指定了车次/车站/线路时要整天数据才找得到，不用首片
  const h0 = parseHash();
  const t0 = h0.kind || h0.unresolved ? null
    : h0.time ?? (saved && okNum(saved.t) && saved.t >= 0 && saved.t <= 1440 ? saved.t : 480);
  if (!(await loadDate(start, t0))) $('loading').textContent = `${start} 数据加载失败`;
})();
</script></body></html>
